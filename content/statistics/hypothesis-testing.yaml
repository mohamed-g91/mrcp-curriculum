# Hypothesis testing: MRCP Part 1 statistics. Lesson 4 of the series: the logic, no maths.
# Lesson 5 (Testing a difference) shows where p comes from; lesson 6 (Confidence intervals and p) the CI.
# One trial runs through the Learn deck: 400 people with high blood pressure, a new drug or a placebo,
# 200 in each group; systolic BP fell 4 mmHg more on the drug (SD of the fall 15 mmHg in each group).
#   SE of the difference = 15 × √(2 ÷ 200) = 1.5 mmHg; 4 ÷ 1.5 ≈ 2.7 SEs, so p ≈ 0.008 (two-sided, normal: 0.0077)
# The small trial (the Not guilty story): the same 4 mmHg in 40 people, 20 in each group:
#   SE = 15 × √(2 ÷ 20) ≈ 4.7 mmHg; 4 ÷ 4.7 ≈ 0.85 SEs, so p ≈ 0.4 (0.399)
# The grid slides show p as the trial run 1,000 times with placebo in both groups: about 8 runs (4 each way) give a gap
# of 4 mmHg or more for 400 people, about 400 (200 each way) for 40 people. These are expected counts, worked out from
# the numbers above in the browser; the narration says "about".
# Two-sided throughout: a gap of 4 counts either way.
# IDs are permanent: never renumber or reuse one. To drop an item, move its ID to `retired`.
# The slides and items that left for lessons 5 and 6 are kept in notes/hypothesis-testing-moved.yaml.

id: stats.hypothesis-testing
title: Hypothesis testing
description: Could this be chance? The null hypothesis, what a p-value means, and the 0.05 line. Learn from one blood pressure trial told as a court case, then practise on exam-style stems.
status: draft
updated: 2026-10-02
sources:
  - Kirkwood BR, Sterne JAC. Essential Medical Statistics, 2nd ed. Chapters 6–8.
  - Petrie A, Sabin C. Medical Statistics at a Glance, 4th ed. Chapters 17–18.
  - Altman DG, Bland JM. Absence of evidence is not evidence of absence. BMJ 1995;311:485.
  - Fisher RA. Statistical Methods for Research Workers. Edinburgh: Oliver and Boyd, 1925.
# c01, c04–c07, c09 and the warm-up w01–w08 moved to lesson 6 (Confidence intervals and p) on 2026-10-02
retired: [c01, c04, c05, c06, c07, c09, w01, w02, w03, w04, w05, w06, w07, w08]
cover: concepts

# Olive goes with testing (the null hypothesis, the p-value, significance).
families:
  test: Testing
  gray: Neutral

concepts:
  h0:   { label: H₀,             family: test, icon: gavel }
  p:    { label: p-value,         family: test, icon: tails }
  # the two verdicts; they are not ideas of their own, so they stay off the cover
  sig:  { label: Significant,     family: test, icon: check, cover: false }
  ns:   { label: Not significant, family: gray, icon: dash,  cover: false }

learn:
  - id: hook
    pattern: hook
    title: Could this be chance?
    stem: 400 people with high blood pressure took a new drug or a placebo, 200 in each group. After 8 weeks, systolic BP had fallen 4 mmHg more on the drug (SD 15 mmHg), p = 0.008.
    question: Could this be chance?
    scene: case-older

  # The court: the judge starts from H₀, the doctor brings the trial's 4 mmHg, p says how often
  # a harmless drug would give that much, and the verdict follows. (The Not guilty story reuses this drawing.)
  - id: court
    pattern: story
    title: Innocent until proven guilty
    kind: art
    art: ht-court
    slots: { claim: "{h0}: no difference in BP", evidence: 4 mmHg, p: p = 0.008, verdict: Guilty, note: "Reject {h0}" }

  # p as the trial run 1,000 times with placebo in both groups: about 8 runs give a gap of 4 mmHg or more, either way.
  - id: p-big
    pattern: story
    title: What does p = 0.008 mean?
    kind: grid
    start: 1
    sd: 15
    gap: 4
    unit: mmHg
    ns: [200]
    labels: [400 people]
    heading: 1,000 trials · placebo in both groups

  # The same 4 mmHg in 40 people (20 in each group): p ≈ 0.4.
  - id: court-small
    pattern: story
    title: The same gap in 40 people
    kind: art
    art: ht-court
    slots: { claim: "{h0}: no difference in BP", evidence: 4 mmHg, p: p = 0.4, verdict: Not guilty, note: ≠ innocent }

  - id: p-small
    pattern: story
    title: What does p = 0.4 mean?
    kind: grid
    start: 1
    sd: 15
    gap: 4
    unit: mmHg
    ns: [20]
    labels: [40 people]
    heading: 1,000 trials · placebo in both groups

  # The line: 1 in 20 = 50 in 1,000, 25 runs at each end. That it is a convention (0.049 and 0.051 are almost
  # the same evidence) is said aloud, not written. Fisher (1925) took p = 0.05 (about 2 SD) as a convenient limit.
  - id: line
    pattern: story
    title: Where is the line?
    kind: grid
    start: 1
    sd: 15
    gap: 4
    ns: [200, 20]
    labels: [400 people, 40 people]
    cut: 0.05
    origin: Fisher, 1925

  - id: hook-solved
    pattern: working
    title: Back to the trial
    scene: doctor-think
    stem: "[[200 people took a new drug and 200 a placebo]]. Systolic BP fell [[4 mmHg more on the drug, p = 0.008]]."
    lines:
      - { family: test, text: "If the drug did nothing:", result: "about 8 in 1,000" }
      - { family: test, text: "p =", result: "0.008" }
      - { family: test, text: "0.008 < 0.05:", result: Significant }
    answer: "Unlikely to be chance. Reject H₀: the drug lowers BP."

practise:
  - id: cases
    pattern: stem-quiz
    title: Could this be chance?
    options: [sig, ns]
    # The first case is the solved example; the rest are dealt in a random order.
    # Every case brings its own options; the scenes are the nearest cartoons from the cast.
    cases:
      - id: c11
        scene: case-older
        solved: true
        stem: In a trial of 400 people with high blood pressure, systolic BP fell [[4 mmHg more on a new drug than on placebo, p = 0.008]].
        question: Is the result statistically significant at the 5% level?
        options: ["Yes: p is below 0.05", "No: 4 mmHg is too small to be significant", "Not without the 95% CI"]
        answer: "Yes: p is below 0.05"
        hint: Compare p with 0.05.
        why: "0.008 is below 0.05, so a gap this big is unlikely to be chance."
        tutor: "If the drug did nothing, a gap of 4 mmHg or more would turn up in about 8 of every 1,000 trials: p = 0.008. That is below 0.05 (1 in 20, or 50 in 1,000), so the result is significant at the 5% level and H₀ is rejected."

      - id: c02
        scene: case-older
        stem: A trial compares a new anticoagulant with warfarin, measuring [[deaths at 1 year]].
        question: What is the null hypothesis?
        options: ["Deaths at 1 year are the same on both drugs", "The new drug lowers deaths at 1 year", "The new drug raises deaths at 1 year"]
        answer: "Deaths at 1 year are the same on both drugs"
        hint: The null hypothesis always assumes nothing is going on.
        why: "H₀ is no difference between the groups. The trial looks for evidence against it."

      - id: c03
        scene: case-analgesic
        stem: A trial of a new painkiller against placebo reports a difference in pain scores with [[p = 0.03]].
        question: What does p = 0.03 mean?
        options: ["If the drug did nothing, a difference this big or bigger would appear 3% of the time", "There is a 3% chance that the drug does nothing", "There is a 97% chance that the drug works"]
        answer: "If the drug did nothing, a difference this big or bigger would appear 3% of the time"
        hint: A p-value is worked out by first assuming the null hypothesis is true.
        why: "p is the chance of a result at least this extreme if H₀ were true. It is not the chance that H₀ is true."

      - id: c08
        scene: case-hip
        stem: A pilot trial in [[30 patients]] finds that pain scores are [[2 points lower on a new drug (0–10 scale), p = 0.2]].
        question: What is the best conclusion?
        options: ["No clear evidence of a difference; the trial may be too small", "The drug does not work", "The drug works"]
        answer: "No clear evidence of a difference; the trial may be too small"
        hint: Not guilty is not the same as innocent.
        why: "p = 0.2 means chance could explain the result, but a small trial can miss a real effect. Absence of evidence is not evidence of absence."

      - id: c10
        scene: doctor-think
        twist: true
        stem: A trial of a new antiemetic finds [[fewer episodes of vomiting on the drug, p = 0.06]]. The authors conclude that [[the drug has no effect]].
        question: Is their conclusion right?
        options: ["No: it is not significant at 5%, but an effect is not ruled out", "Yes: p above 0.05 proves there is no effect", "Yes: the difference was due to chance"]
        answer: "No: it is not significant at 5%, but an effect is not ruled out"
        hint: Failing to reject H₀ is not the same as proving it.
        why: "p = 0.06 is weak evidence, not proof of no effect. A bigger trial might show a real benefit."

  - id: end
    pattern: end
    title: Your score

# Centre, shape and spread: MRCP Part 1 statistics.
# One story runs through the Learn deck: eleven patients leaving one ward this week.
# IDs are permanent: never renumber or reuse one. To drop an item, move its ID to `retired`.

id: stats.centre-shape-spread
title: Centre, shape and spread
description: Mean, median and mode, why data come out normal or skewed, and how SD and IQR describe them. Learn from one ward's lengths of stay, then practise on exam-style stems.
status: reviewed
updated: 2026-09-24
sources:
  - Kirkwood BR, Sterne JAC. Essential Medical Statistics, 2nd ed. Chapters 3–5.
  - Petrie A, Sabin C. Medical Statistics at a Glance, 4th ed. Chapters 5–7.
retired: []
cover: concepts

# The colours follow Types of data: purple goes with numbers and the mean, green with ranks and
# the median, coral with categories and the mode.
families:
  cat: Categories
  np: Skewed
  par: Normal

concepts:
  mean:     { label: Mean,          family: par, icon: balance }
  median:   { label: Median,        family: np,  icon: middle }
  mode:     { label: Mode,          family: cat, icon: peak }
  normal:   { label: Normal,        family: par, letter: N,  icon: bell }
  skewed:   { label: Skewed,        family: np,  letter: S,  icon: tail-right }
  positive: { label: Positive skew, family: np,  letter: "+", icon: tail-right }
  negative: { label: Negative skew, family: np,  letter: "−", icon: tail-left }

learn:
  - id: hook
    pattern: hook
    title: What shape are these stays?
    stem: A study of 200 adults admitted with pneumonia reported a mean length of stay of 6 days (SD 4 days) and a median of 3 days.
    question: What shape is the distribution of length of stay?
    scene: stays-calendar

  # three stories told in the video; each slide shows the scene and a figure that builds a beat per tap
  # the same five readings run through the mean and the median: mean 50 / 5 = 10, then 78 / 5 = 15.6, then 438 / 5 = 87.6
  - id: story-mean
    pattern: story
    title: The mean
    kind: mean
    scene: story-astronomer
    values: [11, 8, 10, 12, 9]

  - id: story-median
    pattern: story
    title: The median
    kind: median
    scene: story-storm
    values: [11, 8, 10, 12, 9]
    outlier: { from: 12, to: [40, 400] }

  # 19 customers: mean 785 / 19 = 41.3, a size nobody wears; mode 42. Twelve donors: mode O
  - id: story-mode
    pattern: story
    title: The mode
    kind: mode
    scene: story-shoes
    unit: shoe size
    counts: { 39: 2, 40: 4, 41: 4, 42: 5, 43: 3, 44: 1 }
    categories_unit: blood group
    categories: { A: 4, B: 2, AB: 1, O: 5 }

  # the ward this week, before its long stay: mode 2, median 3, mean 44 / 11 = 4; tapping one 8 sends it to 30,
  # and only the mean moves (66 / 11 = 6)
  - id: middles
    pattern: dot-plot
    title: Three middles
    values: [1, 2, 2, 2, 3, 3, 4, 5, 6, 8, 8]
    unit: days in hospital
    swap: { from: 8, to: 30 }
    measures: [mean, median, mode]

  # what normal and skewed mean, before any spread: the people drop in one by one, then the curve draws over them
  # normal: a bell, its halves alike, mode = median = mean; skewed: the ward's stays piled against the 0-day wall
  # with a tail of long stays, the middles apart (mode 2, median 3, mean 66 / 11 = 6)
  - id: shapes
    pattern: curve
    title: Distribution
    steps:
      - concept: normal
        shape: normal
        crowd: true
        mean: 162
        sd: 7
        unit: cm
        axis: Height of adult women (cm)
        examples: [Height, Haemoglobin, Serum sodium]
      - concept: skewed
        shape: positive
        values: [1, 2, 2, 2, 3, 3, 4, 5, 6, 8, 30]
        sigma: 0.64
        axis: days in hospital
        wall_label: 0 days
        tail_label: a few long stays
        examples: [Length of stay, CRP, Alcohol units, Triglycerides]

  # spread in normal data: SD bands on the heights bell
  - id: spread
    pattern: curve
    title: "Spread: standard deviation"
    panels:
      - kind: sd
        mean: 162
        sd: 7
        unit: cm
        axis: Height of adult women (cm)
        chips: [±1 SD, ±2 SD, ±3 SD]
        pct: [68%, 95%, 99.7%]
        summary: { family: par, label: Mean (SD), note: Normal data }

  # spread in skewed data, built up: the ward's stays in the order they were admitted; in order, the 6th is the
  # median (3), and the middle of each half of five a quartile (the 3rd, 2; the 9th, 6): median 3 (IQR 2–6).
  # Then the same people stacked on their days under their curve, with the IQR boxed, and mean ± 1 SD (2 to 10)
  # and mean ± 2 SD (−2 to 14, through the wall) for contrast, with the pneumonia stem's SD of 4 (6 ± 2 × 4 = −2, below 0). The ward's own
  # eleven stays have an SD of 8.2; the stem's 4 is used here on purpose, so every slide shows the same numbers
  - id: story-iqr
    pattern: story
    title: "Spread: interquartile range"
    kind: iqr
    scene: stays-calendar
    unit: days
    values: [5, 2, 30, 3, 1, 8, 2, 4, 6, 3, 2]
    panel:
      kind: dots
      values: [1, 2, 2, 2, 3, 3, 4, 5, 6, 8, 30]
      sigma: 0.64
      sd: 4
      unit: days
      chips: [IQR, Mean ± 1 SD, Mean ± 2 SD]
      summary: { family: np, label: Median (IQR), note: Skewed data }

  # on hold until the slides before it are settled
  - id: traps
    hidden: true
    pattern: reveal-cards
    title: Four traps
    cards:
      - { family: np, icon: tail-right, label: Tail to the right, answer: "Positive skew. Skew is named by its tail, not its hump." }
      - { family: np, icon: balance, label: Mean well above median, answer: "Positive skew: the mean follows the tail. In negative skew, mean < median < mode." }
      - { family: np, icon: ruler, label: Mean − 2 SD below zero, answer: "Skewed. A stay or a count cannot be negative, so mean ± SD misleads." }
      - { family: np, icon: middle, label: Skewed data, answer: "Median (IQR) and non-parametric tests. A log transform often makes right skew normal." }

  # the whole algorithm on its own, to explore every branch (the next slide works it on the pneumonia stays)
  - id: algorithm
    pattern: decision-tree
    title: Normal or skewed?
    steps:
      - { q: "Value can't be negative?", at: [1, 1], no: { to: 3 } }
      - { q: "Mean − 2 SD below 0?",     at: [1, 2], yes: positive }
      - { q: "Mean and median apart?",   at: [2, 1], no: normal }
      - { q: "Mean above median?",       at: [2, 2], no: negative }
    end: positive
    examples:
      normal: [Height, Haemoglobin, Serum sodium]
      positive: [Length of stay, CRP, Alcohol units, Triglycerides]
      negative: [Gestational age at birth, Age at death in the UK]

  - id: hook-solved
    pattern: decision-tree
    title: Back to the pneumonia stays
    scene: doctor-think
    stem: A study of 200 adults admitted with pneumonia reported [[a mean length of stay of 6 days (SD 4 days) and a median of 3 days]].
    # four steps in two rows: a value that can't be negative goes to the SD test first (mean − 2 SD below 0
    # means a tail to the right); anything else, or a test that doesn't settle it, goes on to mean against median
    steps:
      - { q: "Value can't be negative?", at: [1, 1], no: { to: 3 } }
      - { q: "Mean − 2 SD below 0?",     at: [1, 2], yes: positive }
      - { q: "Mean and median apart?",   at: [2, 1], no: normal }
      - { q: "Mean above median?",       at: [2, 2], no: negative }
    end: positive
    examples:
      normal: [Height, Haemoglobin, Serum sodium]
      positive: [Length of stay, CRP, Alcohol units, Triglycerides]
      negative: [Gestational age at birth, Age at death in the UK]
    path: [yes, yes]
    wrong:
      - "A stay can't be shorter than 0 days."
      - "6 − 2 × 4 = −2 days, below 0, where no stay can be: a tail of long stays to the right."

practise:
  - id: warmup
    pattern: sort
    title: Sort these variables
    buckets: [normal, positive, negative]
    retry: "Look for a wall: a floor makes a tail to the right, a ceiling a tail to the left."
    done: "Skew is named by its tail. Skewed data are summarised by the median (IQR)."
    items:
      - { id: w01, label: Height of adult women,         answer: normal,   why: "Many small influences, and nothing stops either side." }
      - { id: w02, label: Haemoglobin in healthy adults, answer: normal,   why: Roughly symmetrical about its mean. }
      - { id: w03, label: Serum sodium in healthy adults, answer: normal,  why: "Held tightly around a set point, symmetrical." }
      - { id: w04, label: Length of hospital stay,       answer: positive, why: "A floor at 0 days, but a few stay for weeks." }
      - { id: w05, label: CRP,                           answer: positive, why: "Most are low; infection sends a few very high." }
      - { id: w06, label: Alcohol units per week,        answer: positive, why: "Many drink little or none; a few drink a lot." }
      - { id: w07, label: Serum triglycerides,           answer: positive, why: "Cannot fall below zero; a few are very high." }
      - { id: w08, label: Gestational age at birth,      answer: negative, why: "A ceiling near 42 weeks; some babies are born early." }
      - { id: w09, label: Age at death in the UK,        answer: negative, why: "Most die old; fewer die young, a tail to the left." }

  - id: cases
    pattern: stem-quiz
    title: Name the shape
    options: [normal, positive, negative]
    # The first case is the solved example; the rest are dealt in a random order.
    # A case with its own options overrides the slide's; plain text options are shown in grey.
    cases:
      - id: c01
        scene: case-pneumonia
        solved: true
        stem: A study of 200 adults admitted with pneumonia reported [[a mean length of stay of 6 days (SD 4 days) and a median of 3 days]].
        question: What shape is the distribution of length of stay?
        answer: positive
        hint: Compare the mean with the median.
        why: "A few long stays pull the mean above the median: a tail to the right."
        tutor: "Mean and median apart? Yes. Mean above median? Yes. So positive skew. And 6 − 2 × 4 is below zero, which a stay cannot be."

      - id: c02
        scene: case-crp
        stem: In 150 adults seen in the emergency department, [[CRP had a mean of 45 mg/L and a median of 12 mg/L]].
        question: What shape is the distribution of CRP?
        answer: positive
        hint: Which is larger, the mean or the median?
        why: "A few very high CRPs pull the mean far above the median: positive skew."

      - id: c03
        scene: case-newborn
        stem: In 3,000 births at one maternity unit, [[gestational age had a mean of 38.1 weeks and a median of 39.2 weeks]].
        question: What shape is the distribution of gestational age?
        answer: negative
        hint: Is the mean above or below the median?
        why: "The mean is below the median: a few early births make a tail to the left."

      - id: c04
        scene: case-height
        stem: In 500 healthy men, [[height had a mean of 176 cm and an SD of 7 cm]], with a symmetrical, bell-shaped distribution.
        question: About what proportion are between 162 and 190 cm?
        options: ["68%", "95%", "99.7%"]
        answer: "95%"
        hint: How many SDs from the mean are 162 and 190 cm?
        why: "162 and 190 cm are the mean ± 2 SD. In a normal distribution about 95% lie within 2 SD (1.96 SD exactly)."

      - id: c05
        scene: case-alcohol
        twist: true
        stem: A survey of 800 adults recorded [[alcohol intake with a mean of 14 units per week (SD 16)]].
        question: What shape is the distribution of alcohol intake?
        answer: positive
        hint: What is the mean minus 2 SD, and can intake be that low?
        why: "14 − 2 × 16 = −18 units, which is impossible, so the data are not normal. Many drink little and a few drink a lot: positive skew."

      - id: c06
        scene: case-audit
        stem: A ward audit found that [[length of stay was strongly positively skewed]].
        question: How should length of stay be summarised?
        options: [Mean (SD), Median (IQR), Mode (range)]
        answer: Median (IQR)
        hint: Which middle and which spread are not pulled by the tail?
        why: "The median and IQR are not pulled by the few very long stays; the mean and SD are."

      - id: c07
        scene: case-bloodbag
        stem: A transfusion audit recorded each donor's [[blood group (A, B, AB or O)]].
        question: Which average describes blood group?
        options: [mean, median, mode]
        answer: mode
        hint: Can blood groups be added up, or put in order?
        why: "Blood group is nominal: only the most common group, the mode, makes sense."

      - id: c08
        scene: case-longstay
        twist: true
        stem: Eleven patients on a ward stayed between 1 and 8 days. [[A twelfth patient stays 90 days]].
        question: Which average changes most?
        options: [mean, median, mode]
        answer: mean
        hint: Which average uses the size of every value?
        why: "The mean adds up every value, so one 90-day stay drags it up; the median and mode barely move."

      - id: c09
        scene: case-older
        stem: In a hospice, [[age at death had a mean of 79 years and a median of 83 years]].
        question: What shape is the distribution of age at death?
        answer: negative
        hint: Is the mean above or below the median?
        why: "The mean is below the median: a few younger deaths make a tail to the left."

      # traps: mean − 2 SD is below 0, but the value can be negative, so that says nothing about skew
      - id: c10
        scene: case-glucose
        twist: true
        stem: In a trial of 240 adults with type 2 diabetes, [[the fall in HbA1c after 6 months had a mean of 8 mmol/mol (SD 10) and a median of 8 mmol/mol]].
        question: What shape is the distribution of the fall in HbA1c?
        answer: normal
        hint: Can a fall in HbA1c be less than 0?
        why: "Some patients' HbA1c rose, so a fall can be negative: 8 − 2 × 10 = −12 is no sign of skew. The mean and median match: normal."

      - id: c11
        scene: case-hip
        twist: true
        stem: In 250 women over 65 screened by DEXA, [[the hip T-score had a mean of −1.4 (SD 1.0) and a median of −1.4]].
        question: What shape is the distribution of the hip T-score?
        answer: normal
        hint: Can a T-score be below 0?
        why: "A T-score counts SDs from a young adult's mean, so it is often below 0: −1.4 − 2 × 1.0 = −3.4 says nothing about skew. The mean and median match: normal."

  - id: end
    pattern: end
    title: Your score

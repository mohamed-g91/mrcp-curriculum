# Standard error: MRCP Part 1 statistics.
# One example runs through the Learn deck: the heights of adult women from Centre, shape and spread
# (mean 162 cm, SD 7 cm), measured in a sample of 49, so SEM = 7 ÷ √49 = 1 cm and the 95% CI is 160–164 cm.
# The 95% CI is taught as mean ± 2 SEM throughout, by the author's choice (1.96 SEM exactly); every answer
# comes out the same either way.
# IDs are permanent: never renumber or reuse one. To drop an item, move its ID to `retired`.

id: stats.standard-error
title: Standard error
description: How sure is a mean? The standard error against the standard deviation, why bigger samples give surer means, and the 95% confidence interval against the reference range. Learn from one sample of women's heights, then practise on exam-style stems.
status: draft
updated: 2026-09-27
sources:
  - Kirkwood BR, Sterne JAC. Essential Medical Statistics, 2nd ed. Chapters 4–6.
  - Petrie A, Sabin C. Medical Statistics at a Glance, 4th ed. Chapters 10–11.
retired: []
cover: concepts

# Purple goes with the people and their spread (the SD), as in Centre, shape and spread;
# teal goes with the mean's precision (the SEM and the 95% CI).
families:
  par: People
  se: The mean

concepts:
  mean: { label: Mean, family: par, icon: balance }
  sd:   { label: SD,   family: par, icon: spread }
  sem:  { label: SEM,  family: se,  icon: narrow }

learn:
  - id: hook
    pattern: hook
    title: How sure is the mean?
    stem: A study measured the height of 49 healthy women. Their mean height was 162 cm (SD 7 cm).
    question: How sure can we be that 162 cm is the mean height of all women?
    scene: case-people

  # the same crowd of heights as Centre, shape and spread (mean 162, SD 7); samples of 49 are drawn from it
  # and each sample's mean drops onto a second axis; the means pile up into a bell 7 times narrower (SEM 1)
  - id: sampling
    pattern: story
    title: The standard error
    kind: sampling
    population: { shape: normal, mean: 162, sd: 7 }
    n: 49
    unit: cm
    axis: Height of adult women (cm)
    means_axis: Mean height of 49 women (cm)

  # the people's bell stays as it is; the bell of the means narrows as n grows: 7 ÷ √n = 3.5, 1.75, 1, 0.5
  - id: bigger
    pattern: curve
    title: Bigger sample, smaller error
    panels:
      - kind: sem
        mean: 162
        sd: 7
        unit: cm
        axis: Height of adult women (cm)
        means_axis: Mean height (cm)
        chips: [n = 4, n = 16, n = 49, n = 196]

  # the central limit theorem: lengths of stay are skewed (the pneumonia stays of Centre, shape and spread:
  # mean 6 days, SD 4), yet the means of samples of 16 stays pile up into a bell: SEM = 4 ÷ √16 = 1 day
  - id: clt
    pattern: story
    title: Skewed data, normal means
    kind: sampling
    population: { shape: positive, mean: 6, sd: 4 }
    n: 16
    unit: days
    axis: days in hospital
    means_axis: Mean stay of 16 patients (days)
    wall_label: 0 days

  # mean ± 2 SD, where 95% of women are (148–176 cm), against mean ± 2 SEM, the 95% CI for the mean (160–164 cm)
  - id: ranges
    pattern: curve
    title: Two ranges
    panels:
      - kind: sd
        mean: 162
        sd: 7
        sem: 1
        unit: cm
        axis: Height of adult women (cm)
        chips: [Mean ± 2 SD, Mean ± 2 SEM]
        pct: [95% of women, 95% CI for the mean]
        tags: ["95%", 95% CI]

  - id: compare
    pattern: reveal-cards
    title: SD or SEM?
    cards:
      - { concept: sd,  answer: "How much people differ. It stays about the same as the sample grows." }
      - { concept: sem, answer: "How precise the mean is: SD ÷ √n. It shrinks as the sample grows." }
      - { family: par, icon: spread, label: Mean ± 2 SD,  answer: "The reference range: where 95% of people lie." }
      - { family: se,  icon: narrow, label: Mean ± 2 SEM, answer: "The 95% confidence interval: where the true mean probably lies." }

  - id: hook-solved
    pattern: working
    title: Back to the 49 women
    scene: doctor-think
    stem: A study measured the height of [[49 healthy women. Their mean height was 162 cm (SD 7 cm)]].
    lines:
      - { family: se, text: "SEM = SD ÷ √n" }
      - { family: se, text: "= 7 ÷ √49 = 7 ÷ 7 =", result: 1 cm }
      - { family: se, text: "95% CI = mean ± 2 SEM" }
      - { family: se, text: "= 162 ± 2 × 1 =", result: 160 to 164 cm }
    answer: "We can be 95% sure that the mean height of all women lies between 160 and 164 cm."

practise:
  - id: warmup
    pattern: sort
    title: SD or SEM?
    buckets: [sd, sem]
    retry: "Ask: does it describe the people, or how precise their mean is?"
    done: "The SD describes the people; the SEM describes the mean, and shrinks as the sample grows."
    items:
      - { id: w01, label: How much patients differ,               answer: sd,  why: "The SD is the spread of the people themselves." }
      - { id: w02, label: How precise the mean is,                answer: sem, why: "The SEM is how far a sample's mean tends to be from the true mean." }
      - { id: w03, label: Shrinks as the sample grows,            answer: sem, why: "SEM = SD ÷ √n: more people, a surer mean." }
      - { id: w04, label: Stays about the same as the sample grows, answer: sd, why: "More people do not make people less different." }
      - { id: w05, label: Gives the reference range,              answer: sd,  why: "Mean ± 2 SD holds 95% of people." }
      - { id: w06, label: Gives the 95% confidence interval,      answer: sem, why: "Mean ± 2 SEM: where the true mean probably lies." }
      - { id: w07, label: Mean ± 2 of it holds 95% of patients,   answer: sd,  why: "That is the SD; ± 2 SEM holds far fewer." }
      - { id: w08, label: Makes the tidier error bars,            answer: sem, why: "The SEM is smaller than the SD, so its bars look tighter." }

  - id: cases
    pattern: stem-quiz
    title: How sure is the mean?
    options: [sd, sem]
    # The first case is the solved example; the rest are dealt in a random order.
    # The scenes are the nearest cartoons from the cast for now; new ones are to follow as mockups.
    cases:
      - id: c01
        scene: case-people
        solved: true
        stem: A study measured the height of [[49 healthy women. Their mean height was 162 cm (SD 7 cm)]].
        question: Within what range does the mean height of all women probably lie?
        options: ["160–164 cm", "148–176 cm", "161–163 cm"]
        answer: "160–164 cm"
        hint: Work out the SEM first, from the SD and the number of women.
        why: "SEM = 7 ÷ √49 = 1 cm, so the 95% CI is 162 ± 2 × 1 = 160 to 164 cm."
        tutor: "SEM = SD ÷ √n = 7 ÷ 7 = 1 cm. 95% CI = mean ± 2 SEM = 160 to 164 cm. 148–176 cm is mean ± 2 SD: where 95% of the women themselves lie."

      - id: c02
        scene: case-older
        stem: In [[100 adults, systolic blood pressure had a mean of 132 mmHg and an SD of 20 mmHg]].
        question: What is the standard error of the mean?
        options: ["0.2 mmHg", "2 mmHg", "20 mmHg"]
        answer: "2 mmHg"
        hint: Divide the SD by the square root of the number of people.
        why: "SEM = 20 ÷ √100 = 20 ÷ 10 = 2 mmHg."

      - id: c03
        scene: case-audit
        stem: A study of [[100 patients reported an SEM of 4 mmHg]]. It is repeated in [[400 patients, with the same SD]].
        question: What is the new SEM?
        options: ["1 mmHg", "2 mmHg", "8 mmHg"]
        answer: "2 mmHg"
        hint: The SEM falls with the square root of the sample size.
        why: "Four times the patients, and √4 = 2, so the SEM halves: 4 ÷ 2 = 2 mmHg."

      - id: c04
        scene: doctor-think
        twist: true
        stem: A pilot study of [[50 patients]] gave an SEM too wide to be useful. The team wants to [[halve the SEM]].
        question: How many patients will they need?
        options: ["100", "200", "2,500"]
        answer: "200"
        hint: What must the square root of the sample size do to halve the SEM?
        why: "The SEM falls with √n, so halving it takes four times the patients: 4 × 50 = 200."

      - id: c05
        scene: case-crp
        stem: In [[400 healthy adults, serum sodium had a mean of 140 mmol/L and an SD of 2 mmol/L]].
        question: What is the 95% reference range for serum sodium?
        options: ["136–144 mmol/L", "139.8–140.2 mmol/L", "138–142 mmol/L"]
        answer: "136–144 mmol/L"
        hint: A reference range describes the people, not the mean.
        why: "Mean ± 2 SD = 140 ± 4 = 136 to 144 mmol/L. 139.8–140.2 is the 95% CI for the mean (SEM = 2 ÷ 20 = 0.1)."

      - id: c06
        scene: case-people
        stem: In a trial of a diet, [[64 patients lost a mean of 5 kg at 6 months (SD 8 kg)]].
        question: What is the 95% confidence interval for the mean weight loss?
        options: ["3–7 kg", "−11 to 21 kg", "4–6 kg"]
        answer: "3–7 kg"
        hint: A confidence interval is built from the SEM, not the SD.
        why: "SEM = 8 ÷ √64 = 1 kg, so the 95% CI is 5 ± 2 × 1 = 3 to 7 kg. −11 to 21 kg is where 95% of the patients lie."

      - id: c07
        scene: case-glucose
        stem: A diabetes clinic reported [[HbA1c in 100 patients as a mean of 58 mmol/mol (SD 12), with an SEM of 1.2]].
        question: Which shows how much HbA1c varies between the patients?
        options: [sd, sem]
        answer: sd
        hint: Which one shrinks as more patients are added?
        why: "The SD describes the patients. The SEM (12 ÷ √100 = 1.2) only says how precise the mean is."

      - id: c08
        scene: case-crp
        twist: true
        stem: In [[100 patients, the 95% confidence interval for mean cholesterol was 4.8 to 5.2 mmol/L]].
        question: What is the SD of cholesterol?
        options: ["0.1 mmol/L", "1.0 mmol/L", "2.0 mmol/L"]
        answer: "1.0 mmol/L"
        hint: Half the width of the interval is 2 SEM; then SD = SEM × √n.
        why: "Half the width, 0.2, is 2 SEM, so SEM = 0.1 and SD = 0.1 × √100 = 1.0 mmol/L."

      # 58–62 is ±1/6 SD (SD = 2 × 6 = 12): about 13% of a normal distribution
      - id: c09
        scene: case-kidney
        twist: true
        stem: A poster shows [[eGFR in 36 patients as a mean of 60, with error bars of ± 1 SEM (SEM 2)]].
        question: About what share of the patients have an eGFR between 58 and 62?
        options: [About 95%, About 68%, Far fewer than 68%]
        answer: Far fewer than 68%
        hint: Work out the SD from the SEM first.
        why: "SD = SEM × √n = 2 × 6 = 12, so 58–62 is only a sixth of an SD either side: about 13% of patients. The bars show the SEM, not the patients."

      - id: c10
        scene: case-height
        stem: A paper reports [[a mean height of 176 cm in 100 men, with an SEM of 0.7 cm]].
        question: What is the SD of height?
        options: ["0.07 cm", "7 cm", "70 cm"]
        answer: "7 cm"
        hint: Turn SEM = SD ÷ √n around.
        why: "SD = SEM × √n = 0.7 × 10 = 7 cm."

  - id: end
    pattern: end
    title: Your score

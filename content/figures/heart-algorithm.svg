<svg class="scene" viewBox="0 0 860 420" role="img" aria-label="The hook solved step by step: leads, wall, artery, then the supporting clues">
<defs><marker id="hf-ar-heart-algorithm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><rect x="4" y="20" width="380" height="380" rx="18" fill="var(--surface)" stroke="var(--gray-bd)" stroke-width="2"/><text x="30" y="72" style="text-anchor:start;font-weight:500;fill:var(--text)">A 62-year-old man,</text><text x="30" y="120" style="text-anchor:start;font-weight:500;fill:var(--text)">40 minutes of chest pain.</text><g data-beat="4"><rect x="24" y="142" width="112" height="36" rx="8" fill="var(--hl)"/></g><text x="30" y="168" style="text-anchor:start;font-weight:500;fill:var(--text)">Pulse 42,</text><g data-beat="5"><rect x="24" y="190" width="168" height="36" rx="8" fill="var(--hl)"/></g><text x="30" y="216" style="text-anchor:start;font-weight:500;fill:var(--text)">BP 88/56 mmHg,</text><g data-beat="5"><rect x="24" y="238" width="280" height="36" rx="8" fill="var(--hl)"/></g><text x="30" y="264" style="text-anchor:start;font-weight:500;fill:var(--text)">JVP raised, chest clear.</text><g data-beat="1"><rect x="24" y="286" width="336" height="36" rx="8" fill="var(--hl)"/></g><text x="30" y="312" style="text-anchor:start;font-weight:500;fill:var(--text)">ST elevation in II, III, aVF;</text><text x="30" y="360" style="text-anchor:start;font-weight:500;fill:var(--text)">ST depression in I and aVL.</text><g data-beat="1"><circle cx="430" cy="59" r="18" fill="var(--ink)"/><text x="430" y="65" style="fill:var(--surface);font-size:16px">1</text><text x="464" y="65" style="text-anchor:start;fill:var(--muted)">Leads</text><rect x="560" y="30" width="270" height="58" rx="14" fill="var(--surface)" stroke="var(--gray-bd)" stroke-width="2.5"/><text x="695" y="66" style="fill:var(--ink)">II, III, aVF</text><line x1="695" y1="90" x2="695" y2="118" stroke="var(--muted)" stroke-width="3" marker-end="url(#hf-ar-heart-algorithm)"/></g><g data-beat="2"><circle cx="430" cy="151" r="18" fill="var(--ink)"/><text x="430" y="157" style="fill:var(--surface);font-size:16px">2</text><text x="464" y="157" style="text-anchor:start;fill:var(--muted)">Wall</text><rect x="560" y="122" width="270" height="58" rx="14" fill="var(--surface)" stroke="var(--gray-bd)" stroke-width="2.5"/><text x="695" y="158" style="fill:var(--ink)">Inferior</text><line x1="695" y1="182" x2="695" y2="210" stroke="var(--muted)" stroke-width="3" marker-end="url(#hf-ar-heart-algorithm)"/></g><g data-beat="3"><circle cx="430" cy="243" r="18" fill="var(--ink)"/><text x="430" y="249" style="fill:var(--surface);font-size:16px">3</text><text x="464" y="249" style="text-anchor:start;fill:var(--muted)">Artery</text><rect x="560" y="214" width="270" height="58" rx="14" fill="var(--se-bg)" stroke="var(--se-solid)" stroke-width="2.5"/><text x="695" y="250" style="fill:var(--se-ink)">RCA</text></g><g data-beat="4"><rect x="440" y="320" width="190" height="80" rx="14" fill="var(--surface)" stroke="var(--gray-bd)" stroke-width="2.5"/><text x="535" y="352">Pulse 42</text><text x="535" y="380" style="font-weight:500;fill:var(--muted);font-size:16px">AV node</text><line x1="560" y1="318" x2="640" y2="250" stroke="var(--muted)" stroke-width="3" marker-end="url(#hf-ar-heart-algorithm)"/></g><g data-beat="5"><rect x="650" y="320" width="205" height="80" rx="14" fill="var(--surface)" stroke="var(--gray-bd)" stroke-width="2.5"/><text x="752" y="352" style="font-size:16px">BP ↓, JVP ↑, clear</text><text x="752" y="380" style="font-weight:500;fill:var(--muted);font-size:16px">RV infarct</text><line x1="752" y1="318" x2="752" y2="250" stroke="var(--muted)" stroke-width="3" marker-end="url(#hf-ar-heart-algorithm)"/></g>
</svg>

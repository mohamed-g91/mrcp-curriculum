<svg xmlns="http://www.w3.org/2000/svg" class="scene" viewBox="0 0 860 440" role="img" aria-label="His ECG shows no ST elevation; his troponin rises from 9, below the 99th percentile, to 38 above it: NSTEMI"><path d="M50 400 H380" fill="none" style="stroke:var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 400 V60" fill="none" style="stroke:var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 400.0 h-8" fill="none" style="stroke:var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="406" style="font:500 17px var(--sans);fill:var(--muted);text-anchor:end">0</text><path d="M50 332.0 h-8" fill="none" style="stroke:var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="338" style="font:500 17px var(--sans);fill:var(--muted);text-anchor:end">10</text><path d="M50 264.0 h-8" fill="none" style="stroke:var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="270" style="font:500 17px var(--sans);fill:var(--muted);text-anchor:end">20</text><path d="M50 196.0 h-8" fill="none" style="stroke:var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="202" style="font:500 17px var(--sans);fill:var(--muted);text-anchor:end">30</text><path d="M50 128.0 h-8" fill="none" style="stroke:var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="134" style="font:500 17px var(--sans);fill:var(--muted);text-anchor:end">40</text><path d="M50 60.0 h-8" fill="none" style="stroke:var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="66" style="font:500 17px var(--sans);fill:var(--muted);text-anchor:end">50</text><text x="60" y="46" style="font:500 17px var(--sans);fill:var(--muted);text-anchor:start">Troponin, ng/L</text><path d="M50 304.8 H380" fill="none" style="stroke:var(--ink)" stro
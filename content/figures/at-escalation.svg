<svg xmlns="http://www.w3.org/2000/svg" class="scene" viewBox="0 0 860 420" role="img" aria-label="Two drugs: controlled, continue; still in pain, angiography; a third drug only while waiting"><g data-beat="1"><rect x="110" y="20" width="150" height="380" rx="34" fill="var(--sc-line)"/><circle cx="185" cy="85" r="50" fill="var(--bad-solid)" opacity=".2"/><circle cx="185" cy="210" r="50" fill="var(--sol-solid)" opacity=".2"/><circle cx="185" cy="335" r="50" fill="var(--np-solid)" opacity=".2"/><text x="300" y="34" style="font:500 20px var(--sans);fill:var(--muted);text-anchor:start">On two drugs</text></g><g data-beat="1"><circle cx="185" cy="335" r="50" fill="var(--np-solid)"/><text x="300" y="330" style="font:500 24px var(--sans);fill:var(--np-ink);text-anchor:start">Controlled</text><text x="300" y="362" style="font:500 19px var(--sans);fill:var(--muted);text-anchor:start">Continue · no third drug</text></g><g data-beat="2"><circle cx="185" cy="85" r="50" fill="var(--bad-solid)"/><text x="300" y="92" style="font:500 24px var(--sans);fill:var(--bad-ink);text-anchor:start">Still in pain</text><text x="300" y="124" style="font:500 21px var(--sans);fill:var(--ink);text-anchor:start">Angiography → PCI or CABG</text></g><g data-beat="3"><circle cx="185" cy="210" r="50" fill="var(--sol-solid)"/><text x="300" y="205" style="font:500 24px var(--sans);fill:var(--sol-ink);text-anchor:start">A third drug</text><text x="300" y="237" style="font:500 19px var(--sans);fill:var(--muted);text-anchor:start">Only while waiting, or if PCI or CABG</text><text x="300" y="263" style="font:500 19px var(--sans);fill:var(--muted);text-anchor:start">is unsuitable or declined</text></g></svg>

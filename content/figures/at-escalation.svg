<svg xmlns="http://www.w3.org/2000/svg" class="scene" viewBox="0 0 860 420" role="img" aria-label="Two-drug symptom control and escalation to angiography or revascularisation"><g data-beat="1"><text x="430" y="32" style="font:500 26px var(--sans);fill:var(--ink);text-anchor:middle">Two anti-anginal drugs</text><path d="M430 49 V70 H205 V100 M430 70 H655 V100" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="205" y="129" style="font:500 24px var(--sans);fill:var(--ink);text-anchor:middle">Controlled</text><text x="655" y="129" style="font:500 24px var(--sans);fill:var(--ink);text-anchor:middle">Still symptomatic</text><path d="M205 147 V173 m-6 -8 l6 8 l6 -8" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M655 147 V173 m-6 -8 l6 8 l6 -8" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="205" y="206" style="font:500 23px var(--sans);fill:var(--ink);text-anchor:middle">Continue</text><text x="205" y="234" style="font:500 23px var(--sans);fill:var(--ink);text-anchor:middle">No third drug</text><text x="655" y="206" style="font:500 23px var(--sans);fill:var(--ink);text-anchor:middle">Coronary angiography</text></g><g data-beat="2"><path d="M655 223 V252 m-6 -8 l6 8 l6 -8" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="655" y="282" style="font:500 24px var(--sans);fill:var(--ink);text-anchor:middle">Consider PCI or CABG</text></g><g data-beat="3"><text x="430" y="346" style="font:500 21px var(--sans);fill:var(--ink);text-anchor:middle">Third drug: waiting for revascularisation,</text><text x="430" y="375" style="font:500 21px var(--sans);fill:var(--ink);text-anchor:middle">or intervention unsuitable or declined</text></g></svg>

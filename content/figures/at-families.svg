<svg xmlns="http://www.w3.org/2000/svg" class="scene" viewBox="0 0 860 420" role="img" aria-label="Two drug groups: heart rate and vascular load or supply"><g data-beat="1"><g transform="translate(125 196) scale(0.52)"><path d="M-10 -150 C90 -170 175 -105 165 -5 C155 90 60 160 -45 195 C-125 145 -175 60 -165 -30 C-155 -110 -85 -150 -10 -150 Z" fill="var(--gray-bg)" stroke="var(--wall)" stroke-width="4"/><path d="M15 -145 C25 -70 10 50 -45 192" fill="none" stroke="var(--primary)" stroke-width="10" stroke-linecap="round"/><ellipse cx="21" cy="-88" rx="11" ry="20" fill="var(--sol-bg)" stroke="var(--sol-solid)" stroke-width="3"/></g><text x="125" y="350" style="font:500 20px var(--sans);fill:var(--ink);text-anchor:middle">Supply and demand</text></g><g data-beat="2"><text x="530" y="36" style="font:500 25px var(--sans);fill:var(--cat-ink);text-anchor:middle">Slow the heart</text><path d="M310 66 h18 l8 -14 l12 29 l9 -15 h30" fill="none" stroke="var(--cat-solid)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="305" cy="104" r="17" fill="var(--surface)" stroke="var(--cat-solid,var(--gray-bd))" stroke-width="2.5"/><text x="305" y="110" style="font:500 18px var(--sans);fill:var(--cat-ink);text-anchor:middle">B</text><text x="332" y="110" data-slot="bb" style="font:500 20px var(--sans);fill:var(--cat-ink);text-anchor:start"></text><circle cx="535" cy="104" r="17" fill="var(--surface)" stroke="var(--cat-solid,var(--gray-bd))" stroke-width="2.5"/><text x="535" y="110" style="font:500 18px var(--sans);fill:var(--cat-ink);text-anchor:middle">C</text><text x="562" y="110" data-slot="rlccb" style="font:500 18px var(--sans);fill:var(--cat-ink);text-anchor:start"></text><circle cx="305" cy="151" r="17" fill="var(--surface)" stroke="var(--cat-solid,var(--gray-bd))" stroke-width="2.5"/><text x="305" y="157" style="font:500 18px var(--sans);fill:var(--cat-ink);text-anchor:middle">I</text><text x="332" y="157" data-slot="iva" style="font:500 20px var(--sans);fill:var(--cat-ink);text-anchor:start"></text><text x="657" y="157" style="font:500 20px var(--sans);fill:var(--cat-ink);text-anchor:middle">Demand ↓</text></g><g data-beat="3"><text x="530" y="219" style="font:500 25px var(--sans);fill:var(--se-ink);text-anchor:middle">Open the vessels</text><circle cx="305" cy="259" r="17" fill="var(--surface)" stroke="var(--se-solid,var(--gray-bd))" stroke-width="2.5"/><text x="305" y="265" style="font:500 18px var(--sans);fill:var(--se-ink);text-anchor:middle">D</text><text x="332" y="265" data-slot="dhp" style="font:500 18px var(--sans);fill:var(--se-ink);text-anchor:start"></text><circle cx="628" cy="259" r="17" fill="var(--surface)" stroke="var(--se-solid,var(--gray-bd))" stroke-width="2.5"/><text x="628" y="265" style="font:500 18px var(--sans);fill:var(--se-ink);text-anchor:middle">N</text><text x="655" y="265" data-slot="nitrate" style="font:500 20px var(--sans);fill:var(--se-ink);text-anchor:start"></text><circle cx="305" cy="306" r="17" fill="var(--surface)" stroke="var(--se-solid,var(--gray-bd))" stroke-width="2.5"/><text x="305" y="312" style="font:500 18px var(--sans);fill:var(--se-ink);text-anchor:middle">K</text><text x="332" y="312" data-slot="nico" style="font:500 20px var(--sans);fill:var(--se-ink);text-anchor:start"></text><text x="660" y="312" style="font:500 20px var(--sans);fill:var(--se-ink);text-anchor:middle">Load ↓ / supply ↑</text></g><g data-beat="4"><circle cx="305" cy="362" r="17" fill="var(--surface)" stroke="var(--gray-solid,var(--gray-bd))" stroke-width="2.5"/><text x="305" y="368" style="font:500 18px var(--sans);fill:var(--gray-ink);text-anchor:middle">R</text><text x="332" y="368" data-slot="rano" style="font:500 20px var(--sans);fill:var(--gray-ink);text-anchor:start"></text><text x="665" y="368" style="font:500 18px var(--sans);fill:var(--ink);text-anchor:middle">Outside the two groups</text><text x="430" y="412" style="font:500 18px var(--sans);fill:var(--muted);text-anchor:middle">The groups
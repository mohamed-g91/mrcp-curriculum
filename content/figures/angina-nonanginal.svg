<svg class="scene" viewBox="0 0 860 420" role="img" aria-label="Non-anginal chest pain: no cardiac test if the resting ECG is normal; CT coronary angiography if it is not">
<defs><marker id="ag-ar-angina-nonanginal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><g data-beat="1"><rect x="265.0" y="10" width="330" height="52" rx="14" fill="var(--se-bg)" stroke="var(--se-solid)" stroke-width="2.5"/><text x="430" y="42.0" style="font-size:18px;font-weight:750;text-anchor:middle;fill:var(--se-ink)">Non-anginal chest pain</text><line x1="430" y1="64" x2="430" y2="92" stroke="var(--muted)" stroke-width="3" marker-end="url(#ag-ar-angina-nonanginal)"/><rect x="310.0" y="94" width="240" height="48" rx="14" fill="var(--surface)" stroke="var(--gray-bd)" stroke-width="2.5"/><text x="430" y="124.0" style="font-size:18px;font-weight:750;text-anchor:middle;fill:var(--ink)">Resting ECG</text></g><g data-beat="2"><line x1="330" y1="130" x2="230" y2="196" stroke="var(--muted)" stroke-width="3" marker-end="url(#ag-ar-angina-nonanginal)"/><text x="258" y="156" style="font-size:16px;font-weight:750;text-anchor:middle;fill:var(--muted)">Normal</text><rect x="45.0" y="198" width="330" height="74" rx="14" fill="var(--surface)" stroke="var(--gray-bd)" stroke-width="2.5"/><text x="210" y="231.0" style="font-size:18px;font-weight:750;text-anchor:middle;fill:var(--ink)">No cardiac test</text><text x="210" y="253.0" style="font-size:14px;font-weight:550;text-anchor:middle;fill:var(--muted)">look for another cause: gut, chest wall</text></g><g data-beat="3"><line x1="530" y1="130" x2="630" y2="196" stroke="var(--muted)" stroke-width="3" marker-end="url(#ag-ar-angina-nonanginal)"/><text x="612" y="156" style="font-size:16px;font-weight:750;text-anchor:middle;fill:var(--muted)">Abnormal</text><rect x="485.0" y="198" width="330" height="74" rx="14" fill="var(--se-bg)" stroke="var(--se-solid)" stroke-width="2.5"/><text x="650" y="231.0" style="font-size:18px;font-weight:750;text-anchor:middle;fill:var(--se-ink)">CT coronary angiography</text><text x="650" y="253.0" style="font-size:14px;font-weight:550;text-anchor:middle;fill:var(--muted)">as for angina</text><text x="650" y="306" style="font-size:16px;font-weight:650;text-anchor:middle;fill:var(--muted)">ST-T changes or Q waves</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" class="scene" viewBox="0 0 860 420" role="img" aria-label="First-line beta-blocker or calcium channel blocker, followed by dose review"><g data-beat="1"><text x="430" y="32" style="font:500 26px var(--sans);fill:var(--ink);text-anchor:middle">First line</text><path d="M430 48 V63 H220 V85 M430 63 H650 V85" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="115" cy="109" r="17" fill="var(--surface)" stroke="var(--cat-solid,var(--gray-bd))" stroke-width="2.5"/><text x="115" y="115" style="font:500 18px var(--sans);fill:var(--cat-ink);text-anchor:middle">B</text><text x="142" y="115" data-slot="bb" style="font:500 20px var(--sans);fill:var(--cat-ink);text-anchor:start"></text><text x="430" y="115" style="font:500 20px var(--sans);fill:var(--muted);text-anchor:middle">OR</text><text x="650" y="115" style="font:500 22px var(--sans);fill:var(--ink);text-anchor:middle">Calcium channel blocker</text></g><g data-beat="2"><path d="M650 131 V150 H490 V172 M650 150 H740 V172" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="198" r="17" fill="var(--surface)" stroke="var(--cat-solid,var(--gray-bd))" stroke-width="2.5"/><text x="345" y="204" style="font:500 18px var(--sans);fill:var(--cat-ink);text-anchor:middle">C</text><text x="372" y="204" data-slot="rlccb" style="font:500 18px var(--sans);fill:var(--cat-ink);text-anchor:start"></text><circle cx="620" cy="198" r="17" fill="var(--surface)" stroke="var(--se-solid,var(--gray-bd))" stroke-width="2.5"/><text x="620" y="204" style="font:500 18px var(--sans);fill:var(--se-ink);text-anchor:middle">D</text><text x="647" y="204" data-slot="dhp" style="font:500 17px var(--sans);fill:var(--se-ink);text-anchor:start"></text><text x="430" y="249" style="font:500 22px var(--sans);fill:var(--ink);text-anchor:middle">Choose by pulse, BP and comorbidities</text></g><g data-beat="3"><text x="430" y="292" style="font:500 22px var(--sans);fill:var(--ink);text-anchor:middle">Active asthma: a suitable CCB</text><text x="430" y="323" style="font:500 19px var(--sans);fill:var(--muted);text-anchor:middle">Verapamil/diltiazem: no HFrEF or conduction disease</text></g><g data-beat="4"><path d="M190 395 h60 v-12 h60 v-12 h60" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="374" style="font:500 23px var(--sans);fill:var(--ink);text-anchor:middle">Titrate as tolerated</text><text x="560" y="406" style="font:500 20px var(--sans);fill:var(--muted);text-anchor:middle">Review in 2–4 weeks</text></g></svg>

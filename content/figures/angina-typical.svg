uted)" stroke-width="3" stroke-linejoin="round" marker-end="url(#ag-ar-angina-typical)"/><text x="677" y="110" style="font-size:15px;font-weight:700;text-anchor:start;fill:var(--muted)">Yes</text><rect x="495.0" y="118" width="340" height="64" rx="14" fill="var(--surface)" stroke="var(--gray-bd)" stroke-width="2.5"/><path d="M529 144 c-10 -10 -24 -2 -18 10 c4 8 18 16 18 16 c0 0 14 -8 18 -16 c6 -12 -8 -20 -18 -10 z" fill="var(--cat-bg)" stroke="var(--cat-solid)" stroke-width="2.5"/><path d="M519 152 l5 0 l3 -6 l4 12 l3 -6 l5 0" fill="none" stroke="var(--cat-solid)" stroke-width="2.5" stroke-linejoin="round"/><text x="557.0" y="146.0" style="font-size:18px;font-weight:750;text-anchor:start;fill:var(--ink)">Functional test</text><text x="557.0" y="167.0" style="font-size:13px;font-weight:600;text-anchor:start;fill:var(--muted)">old MI, stent, bypass · or exercise ECG</text></g></g><g data-beat="6"><rect x="190" y="130" width="480" height="150" rx="20" fill="var(--bad-bg)" stroke="var(--bad-solid)" stroke-width="3"/><text x="430" y="196" style="font-size:30px;font-weight:800;text-anchor:middle;fill:var(--bad-ink)">Exercise ECG is not</text><text x="430" y="238" style="font-size:30px;font-weight:800;text-anchor:middle;fill:var(--bad-ink)">a first-line test</text></g>

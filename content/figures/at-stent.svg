nejoin="round"/><path d="M140.0 328 l12 22 l-12 22" fill="none" stroke="var(--wall)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M153.3 328 l12 22 l-12 22" fill="none" stroke="var(--wall)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M166.7 328 l12 22 l-12 22" fill="none" stroke="var(--wall)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="120.0" cy="350" rx="20" ry="21" fill="var(--bad-solid)"/><text x="535" y="345" style="font:500 21px var(--sans);fill:var(--bad-ink);text-anchor:middle">Unplanned early interruption → stent thrombosis</text><text x="535" y="377" style="font:500 21px var(--sans);fill:var(--bad-ink);text-anchor:middle">May present as STEMI</text></g></svg>

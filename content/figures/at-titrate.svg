inejoin="round"/><circle cx="300" cy="330" r="11" fill="var(--ink)"/><rect x="600" y="110" width="200" height="104" rx="16" fill="var(--gray-bg)" stroke="var(--gray-bd)" stroke-width="2"/><text x="700" y="146" style="font:500 18px var(--sans);fill:var(--muted);text-anchor:middle">Pulse</text><text x="700" y="192" style="font:500 36px var(--sans);fill:var(--ink);text-anchor:middle">64</text></g><g data-beat="3"><path d="M90 330 A210 210 0 0 1 352.2 126.6" fill="none" stroke="var(--cat-bd)" stroke-width="28" stroke-linecap="round"/><path d="M300 330 L331.9 163.0" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="330" r="11" fill="var(--ink)"/><rect x="600" y="110" width="200" height="104" rx="16" fill="var(--bad-bg)" stroke="var(--bad-bd)" stroke-width="2"/><text x="700" y="146" style="font:500 18px var(--sans);fill:var(--muted);text-anchor:middle">Pulse</text><text x="700" y="192" style="font:500 36px var(--sans);fill:var(--bad-ink);text-anchor:middle">52</text></g><g data-beat="3"><text x="700" y="252" style="font:500 22px var(--sans);fill:var(--bad-ink);text-anchor:middle">Stop here</text><text x="700" y="280" style="font:500 18px var(--sans);fill:var(--muted);text-anchor:middle">not at 20 mg</text></g><g data-beat="4"><text x="700" y="340" style="font:500 19px var(--sans);fill:var(--ink);text-anchor:middle">Review in 2–4 weeks</text><text x="700" y="368" style="font:500 19px var(--sans);fill:var(--muted);text-anchor:middle">Limit: pulse or BP</text></g></svg>

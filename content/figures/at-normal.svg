<svg xmlns="http://www.w3.org/2000/svg" class="scene" viewBox="0 0 860 420" role="img" aria-label="Mechanism-directed treatment for vasospastic and microvascular angina"><g data-beat="1"><text x="215" y="36" style="font:500 25px var(--sans);fill:var(--ink);text-anchor:middle">Vasospastic</text><path d="M140 86 H290 M140 104 H290" fill="none" stroke="var(--primary)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="645" y="36" style="font:500 25px var(--sans);fill:var(--ink);text-anchor:middle">Microvascular</text><path d="M560 82 h65 l50 -30 m-50 30 l50 34 m-50 -34 v48" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M675 52 l45 -22 m-45 22 l45 16 m-45 48 l45 -15 m-45 15 l45 25" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-beat="2"><text x="215" y="186" style="font:500 24px var(--sans);fill:var(--ink);text-anchor:middle">CCB first</text><text x="215" y="224" style="font:500 24px var(--sans);fill:var(--ink);text-anchor:middle">Add nitrate if needed</text><text x="215" y="280" style="font:500 21px var(--sans);fill:var(--bad-ink);text-anchor:middle">Avoid beta-blockers</text><text x="215" y="308" style="font:500 21px var(--sans);fill:var(--bad-ink);text-anchor:middle">in isolated spasm</text></g><g data-beat="3"><text x="645" y="186" style="font:500 21px var(--sans);fill:var(--ink);text-anchor:middle">Treat the mechanism</text><text x="645" y="222" style="font:500 21px var(--sans);fill:var(--ink);text-anchor:middle">Impaired flow reserve:</text><text x="645" y="258" style="font:500 21px var(--sans);fill:var(--ink);text-anchor:middle">Beta-blocker / CCB</text><text x="645" y="294" style="font:500 21px var(--sans);fill:var(--ink);text-anchor:middle">Spasm: CCB</text></g><g data-beat="4"><text x="430" y="367" style="font:500 23px var(--sans);fill:var(--ink);text-anchor:middle">Treat risk factors</text><text x="430" y="410" style="font:500 19px var(--sans);fill:var(--muted);text-anchor:middle">Antiplatelets are not automatic without atherosclerotic CAD</text></g></svg>

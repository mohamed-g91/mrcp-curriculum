<svg class="scene" viewBox="0 0 820 400" role="img" aria-label="A court: a judge at the bench, a doctor bringing evidence, and a capsule in the dock">
  <!-- the judge at the raised bench, centre top; the gavel on the bench -->
  <g class="sc-pop" style="--i:0">
    <g transform="translate(410 196) scale(.85)">
      <path class="sc-o" d="M-52 -4 L-44 -120 C-40 -140 -20 -148 0 -148 C20 -148 40 -140 44 -120 L52 -4 Z" fill="#26303C"/>
      <path class="sc-o" d="M-8 -146 h16 v26 h-16 Z" fill="#FFFFFF"/>
      <path class="sc-f" d="M0 -146 V-120"/>
      <rect class="sc-o" x="-9" y="-170" width="18" height="22" rx="4" fill="#E8B894"/>
      <circle class="sc-o" cx="-30" cy="-188" r="12" fill="#D9DDE3"/><circle class="sc-o" cx="30" cy="-188" r="12" fill="#D9DDE3"/>
      <circle class="sc-o" cx="-30" cy="-166" r="11" fill="#D9DDE3"/><circle class="sc-o" cx="30" cy="-166" r="11" fill="#D9DDE3"/>
      <circle class="sc-o" cx="0" cy="-196" r="28" fill="#E8B894"/>
      <path class="sc-o" d="M-28 -200 C-26 -230 26 -230 28 -200 C18 -212 -18 -212 -28 -200 Z" fill="#D9DDE3"/>
      <circle cx="-10" cy="-196" r="3" fill="#22303F"/><circle cx="10" cy="-196" r="3" fill="#22303F"/>
      <path class="sc-f" d="M-8 -182 h16"/>
    </g>
    <rect class="sc-o" x="280" y="168" width="260" height="84" rx="6" fill="#8A6A4A"/>
    <g transform="translate(508 156) rotate(-30)">
      <rect class="sc-o" x="-18" y="-8" width="36" height="16" rx="4" fill="#6E5238"/>
      <rect class="sc-o" x="-3" y="8" width="6" height="32" rx="3" fill="#A9855F"/>
    </g>
  </g>
  <!-- the doctor who ran the trial, bottom left -->
  <g class="sc-pop" style="--i:1">
    <g transform="translate(47 394) scale(.72)">
      <rect class="sc-o" x="-24" y="-80" width="20" height="78" rx="6" fill="#2B3A55"/>
      <rect class="sc-o" x="4" y="-80" width="20" height="78" rx="6" fill="#2B3A55"/>
      <path class="sc-o" d="M-44 -150 C-40 -168 -18 -176 0 -176 C18 -176 40 -168 44 -150 L50 -72 L-50 -72 Z" fill="#F4F6F9"/>
      <path class="sc-o" d="M-12 -174 L0 -148 L12 -174 Z" fill="#2E9C8F"/>
      <rect class="sc-o" x="-8" y="-196" width="16" height="20" rx="4" fill="#B97A50"/>
      <circle class="sc-o" cx="0" cy="-220" r="27" fill="#B97A50"/>
      <path class="sc-o" d="M-27 -226 C-30 -250 -10 -256 2 -254 C20 -252 30 -242 27 -226 C18 -238 -12 -240 -27 -226 Z" fill="#2A1D14"/>
      <circle cx="-9" cy="-220" r="3" fill="#22303F"/><circle cx="9" cy="-220" r="3" fill="#22303F"/>
      <path class="sc-f" d="M-8 -206 q8 5 16 0"/>
    </g>
  </g>
  <!-- the accused: a capsule in the dock, bottom right -->
  <g class="sc-pop" style="--i:2">
    <rect class="sc-o" x="606" y="306" width="96" height="84" rx="6" fill="#C9D3DF"/>
    <g transform="translate(654 262)">
      <rect class="sc-o" x="-26" y="-52" width="52" height="104" rx="26" fill="#FFFFFF"/>
      <path class="sc-o" d="M-26 0 V-26 a26 26 0 0 1 52 0 V0 Z" fill="#3A7BC8"/>
      <circle cx="-9" cy="15" r="3" fill="#22303F"/><circle cx="9" cy="15" r="3" fill="#22303F"/>
      <path class="sc-f" d="M-7 29 q7 -4 14 0"/>
    </g>
  </g>
  <!-- 1: the judge starts from the null hypothesis, on the bench -->
  <g data-beat="1" class="ct-plaque f-test">
    <rect x="292" y="190" width="236" height="40" rx="20"/>
    <text x="410" y="216" data-slot="claim"/>
  </g>
  <!-- 2: the doctor holds up the trial's result -->
  <g data-beat="2">
    <path d="M65 280 L103 256" stroke="#22303F" stroke-width="15" stroke-linecap="round"/>
    <path d="M65 280 L103 256" stroke="#F4F6F9" stroke-width="9" stroke-linecap="round"/>
    <g class="ct-paper">
      <rect class="sc-o" x="85" y="214" width="146" height="56" rx="6"/>
      <path class="ct-arrow" d="M111 228 V256 M103 248 L111 257 L119 248"/>
      <text x="175" y="251" data-slot="evidence"/>
    </g>
  </g>
  <!-- 3: how often a harmless drug would give this -->
  <g data-beat="3" class="ct-p f-test">
    <rect x="75" y="150" width="150" height="44" rx="22"/>
    <text x="150" y="179" data-slot="p"/>
  </g>
  <!-- 4: the verdict, beside the judge, and the gavel comes down -->
  <g data-beat="4">
    <path class="ct-strike" d="M536 132 l12 -10 M544 146 l16 -4 M526 124 l4 -14"/>
    <g class="ct-verdict f-test">
      <rect x="592" y="34" width="208" height="84" rx="14"/>
      <text class="ct-big" x="696" y="72" data-slot="verdict"/>
      <text x="696" y="101" data-slot="note"/>
    </g>
  </g>
</svg>

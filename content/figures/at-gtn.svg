<svg xmlns="http://www.w3.org/2000/svg" class="scene" viewBox="0 0 860 420" role="img" aria-label="GTN doses at zero and five minutes; persistent pain at ten minutes needs an ambulance"><g data-beat="1"><text x="135" y="36" style="font:500 27px var(--sans);fill:var(--ink);text-anchor:middle">0 min</text><rect x="121" y="78" width="28" height="45" rx="4" fill="var(--gray-bg)" stroke="var(--gray-bd)" stroke-width="2"/><path d="M127 78 v-10 h20 v7 m-20 -7 h-7" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 72 l-14 -8 m14 8 l-17 1 m17 -1 l-12 10" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="167" style="font:500 20px var(--sans);fill:var(--ink);text-anchor:middle">GTN under the tongue</text><text x="135" y="198" style="font:500 18px var(--sans);fill:var(--muted);text-anchor:middle">Pain or planned exertion</text></g><g data-beat="2"><text x="430" y="36" style="font:500 27px var(--sans);fill:var(--ink);text-anchor:middle">5 min</text><rect x="416" y="78" width="28" height="45" rx="4" fill="var(--gray-bg)" stroke="var(--gray-bd)" stroke-width="2"/><path d="M422 78 v-10 h20 v7 m-20 -7 h-7" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 72 l-14 -8 m14 8 l-17 1 m17 -1 l-12 10" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="167" style="font:500 20px var(--sans);fill:var(--ink);text-anchor:middle">Pain persists: repeat GTN</text><text x="430" y="198" style="font:500 18px var(--sans);fill:var(--muted);text-anchor:middle"></text><path d="M235 99 L355 99" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M355 99 l-8 -6 m8 6 l-8 6" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-beat="3"><text x="725" y="36" style="font:500 27px var(--sans);fill:var(--ink);text-anchor:middle">10 min</text><rect x="681" y="76" width="88" height="44" rx="5" fill="var(--gray-bg)" stroke="var(--gray-bd)" stroke-width="2"/><path d="M738 83 h22 v22 h-22z M695 98 h18 m-9 -9 v18" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="699" cy="123" r="8" fill="var(--ink)"/><circle cx="751" cy="123" r="8" fill="var(--ink)"/><text x="725" y="167" style="font:500 20px var(--sans);fill:var(--ink);text-anchor:middle">Pain persists: ambulance</text><text x="725" y="198" style="font:500 18px var(--sans);fill:var(--muted);text-anchor:middle"></text><path d="M530 99 L650 99" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 99 l-8 -6 m8 6 l-8 6" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-beat="4"><text x="430" y="270" style="font:500 23px var(--sans);fill:var(--ink);text-anchor:middle">NO → cGMP ↑ → veins relax → preload ↓</text><text x="430" y="311" style="font:500 20px var(--sans);fill:var(--muted);text-anchor:middle">Headache · flushing · light-headedness</text><text x="430" y="339" style="font:500 18px var(--sans);fill:var(--muted);text-anchor:middle">Sit down if light-headed</text></g><g data-beat="5"><rect x="40" y="363" width="780" height="55" rx="14" fill="var(--bad-bg)" stroke="var(--bad-bd)" stroke-width="2"/><text x="430" y="386" style="font:500 20px var(--sans);fill:var(--bad-ink);text-anchor:middle">GTN + sildenafil / other PDE5 inhibitors: avoid</text><text x="430" y="409" style="font:500 18px var(--sans);fill:var(--bad-ink);text-anchor:middle">Severe hypotension</text></g></svg>

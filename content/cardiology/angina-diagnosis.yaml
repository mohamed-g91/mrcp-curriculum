# Is it angina? MRCP Part 1 cardiology. Lesson 2 of chapter A, coronary heart disease (stable angina, part 1: diagnosis).
# The question: a patient with chest pain; is it angina, and which test does NICE want first?
# Two patients open the lesson (the user, 2026-10-14), both with risk factors and no known heart disease. B's episodes last
# about ten minutes, the last two weeks ago: rest pain over 15 minutes may be ACS (CG95 1.2.1.3; Codex QA, 2026-10-15).
#   A, a man of 61, typical angina (three features), resting ECG normal  -> CT coronary angiography;
#   B, a woman of 58, non-anginal pain (one feature), T-wave inversion V4-V6 -> CT coronary angiography too.
# Checked 2026-10-14 against NICE CG95, section 1.3 (read on nice.org.uk); see notes/angina-diagnosis-plan.md.
# Exercise ECG appears only where NICE keeps it (known disease, 1.3.4.4); when to stop it is left out (the user).
# IDs are permanent: never renumber or reuse one. To drop an item, move its ID to `retired`.

id: cardio.angina-diagnosis
title: Is it angina?
title_ar: هل هي ذبحة صدرية؟
description: Typical, atypical or non-anginal chest pain, and the test NICE wants first. Learn from two patients with risk factors, then practise on exam-style stems.
status: reviewed
updated: 2026-10-14
sources:
  - NICE CG95. Recent-onset chest pain of suspected cardiac origin, assessment and diagnosis, 2010, updated 2016 (section 1.3; read 2026-10-14).
  - Vrints C, Andreotti F, Koskinas KC, et al. 2024 ESC Guidelines for the management of chronic coronary syndromes. Eur Heart J 2024;45:3415–3537 (vasospastic and microvascular angina).
retired: []
cover: concepts

# One colour per kind of chest pain.
families:
  cat: Typical
  sol: Atypical
  se: Non-anginal
  gray: Neutral
families_ar:
  cat: نموذجية
  sol: غير نموذجية
  se: غير ذبحي
  gray: محايد

concepts:
  typical:    { label: Typical angina,  ar: ذبحة نموذجية,      family: cat, letter: T, icon: check }
  atypical:   { label: Atypical angina, ar: ذبحة غير نموذجية,  family: sol, letter: A, icon: dash }
  nonanginal: { label: Non-anginal,     ar: ألم صدري غير ذبحي, family: se,  letter: N, icon: cross }

learn:
  # Two patients side by side, each drawn above their own card (mockup C, the user, 2026-10-14). The stems name no pain
  # type: B's pain sounds cardiac (tight, central) and only counting the features shows it is non-anginal.
  - id: hook
    pattern: hook
    title: Two patients
    title_ar: مريضان
    question: What is the next step in management?
    patients:
      - name: Patient A
        person: case-chest-man
        stem: "A 61-year-old man with type 2 diabetes and hypertension, who smokes, has no history of heart disease. For four months he has had central chest tightness walking uphill, spreading to his left arm and gone three minutes after he stops. Examination is normal. His resting ECG:"
        figure: ecg-v4v6-normal
      - name: Patient B
        person: case-chest-woman
        stem: "A 58-year-old woman with hypertension, who smokes, has no history of heart disease. For six weeks she has had a tight central chest feeling while watching television, fading after about ten minutes; the last was two weeks ago. Examination is normal. Her resting ECG:"
        figure: ecg-v4v6-tinv

  # Why the pain comes on exertion and goes with rest (kept short, the user): the narrowing lets through what rest needs,
  # not what the hill needs; the arrows match the numbers (mockup B, the user, 2026-10-14).
  - id: supply
    pattern: story
    title: Supply and demand
    title_ar: العرض والطلب
    kind: art
    art: angina-supply

  # NICE CG95 1.3.3.1: three features typical, two atypical, one or none non-anginal; 1.3.3.5: what makes angina unlikely.
  - id: features
    pattern: story
    title: Anginal or non-anginal?
    title_ar: ذبحي أم غير ذبحي؟
    kind: art
    art: angina-features

  # 1.3.4.3: typical or atypical, no known disease -> CTCA; 1.3.5.1 uncertain -> functional imaging; 1.3.5.2 inconclusive
  # -> invasive angiography; 1.3.4.4 known disease -> functional test (or exercise ECG); 1.3.6.5 exercise ECG never first.
  # The "for everyone" work-up is cut (the user, review 1).
  - id: typical
    pattern: story
    title: Typical and atypical angina
    title_ar: الذبحة النموذجية وغير النموذجية
    kind: art
    art: angina-typical
    start: 1

  # 1.3.1.1 and 1.3.3.12: non-anginal pain with a normal resting ECG needs no cardiac test; with ST-T changes or Q waves,
  # CTCA (1.3.4.3). Patient B is the second branch.
  - id: nonanginal
    pattern: story
    title: Non-anginal chest pain
    title_ar: ألم صدري غير ذبحي
    kind: art
    art: angina-nonanginal
    start: 1

  # 1.3.6.1-3: the functional tests and their stress agents. Adenosine and dipyridamole can cause bronchospasm, so asthma
  # takes dobutamine. Exercise ECG only where NICE keeps it: known disease (1.3.4.4), never to diagnose (1.3.6.5).
  # Asthma is the exam's trick, so it comes last and stands apart (the user, 2026-10-14).
  - id: stress
    pattern: reveal-cards
    title: Stressing the heart
    title_ar: اختبارات الإجهاد
    blind: true
    cards:
      - { family: gray, icon: artery, label: "Perfusion scan (SPECT)", ar: التصوير النووي, answer: "Blood flow to the muscle. Adenosine, dipyridamole or dobutamine" }
      - { family: gray, icon: artery, label: "Stress echo",            ar: إيكو بالإجهاد, answer: "Wall movement. Exercise or dobutamine" }
      - { family: gray, icon: artery, label: "Stress MRI",             ar: رنين بالإجهاد, answer: "Blood flow: adenosine or dipyridamole. Wall movement: exercise or dobutamine" }
      - { family: gray, icon: dash,   label: "Exercise ECG",           ar: تخطيط بالجهد, answer: "Known disease only; never to diagnose angina without it" }
      - { family: gray, icon: bulb, pitfall: true, label: "Asthma?",                ar: الربو, answer: "Dobutamine: adenosine and dipyridamole tighten the airways" }

  # 1.3.7.3: typical pain with clear epicardial arteries; syndrome X (microvascular), then Prinzmetal (vasospastic, at
  # rest, transient ST elevation; ESC 2024). Prinzmetal pain comes at rest, so it is angina-like rather than typical.
  - id: normal
    pattern: story
    title: Angina with a normal angiogram
    title_ar: ذبحة مع تصوير شرايين طبيعي
    kind: art
    art: angina-normal

  # Back to the hook: count the features, read the resting ECG, then no known disease -> CTCA for both.
  - id: solve
    pattern: story
    title: Back to the hook
    title_ar: العودة إلى الحالة
    kind: art
    art: angina-solve

practise:
  - id: cases
    pattern: stem-quiz
    title: Is it angina?
    title_ar: هل هي ذبحة صدرية؟
    options: [typical, atypical, nonanginal]
    # The first case is the solved example; the rest are dealt in a random order.
    cases:
      - id: c01
        scene: case-two-patients
        solved: true
        options: [CTCA for both, "CTCA for A; no test for B", Exercise ECG for both, "Angiography for A; CTCA for B"]
        stem: "Two patients with risk factors and no known heart disease. A, a man of 61, has central chest tightness walking uphill, gone three minutes after he stops; resting ECG normal. B, a woman of 58, has chest tightness while watching television, fading after ten minutes, last two weeks ago; resting ECG: [[T-wave inversion in V4–V6]]."
        question: What is the next step in management?
        answer: CTCA for both
        hint: Does an abnormal resting ECG change the plan for non-anginal pain?
        why: "Patient A's pain is constricting, brought on by exertion and relieved by rest within 5 minutes, so it has all three features of typical angina; a normal resting ECG does not rule angina out. Patient B's pain has only one feature, so it is non-anginal, but her T-wave inversion in V4–V6 means coronary disease cannot be excluded. With no known coronary disease, both need CT coronary angiography (NICE CG95)."
        notes:
          "CTCA for A; no test for B": "No test is offered only for non-anginal pain with a normal resting ECG; patient B has T-wave inversion in V4–V6, which means she needs CT coronary angiography too."
          "Exercise ECG for both": "An exercise ECG is not used to diagnose angina in people without known coronary disease and is not the first-line investigation (NICE CG95)."
          "Angiography for A; CTCA for B": "Invasive coronary angiography comes only after non-invasive tests are inconclusive, so patient A starts with CT coronary angiography too."
        tutor: "Look for three points: anginal or non-anginal pain, ECG changes if non-anginal, and known coronary disease."

      - id: c02
        scene: case-stairs-man
        options: [typical, atypical, nonanginal, Unstable angina]
        stem: "A 57-year-old man has had two months of central chest tightness when he climbs the stairs at work. [[It takes 10 minutes to settle]] after he stops."
        question: How is his chest pain classed?
        answer: atypical
        hint: Count the three features. Which one is missing?
        why: "His pain is constricting and brought on by exertion, but it takes more than 5 minutes to settle with rest. This patient has two of the three features of typical anginal pain, so it is atypical angina (NICE CG95)."
        notes:
          "typical": "Typical angina has all three features: constricting pain, brought on by exertion, and relieved by rest or GTN within about 5 minutes."
          "nonanginal": "Non-anginal pain has one or none of the three features."
          "Unstable angina": "Unstable angina is chest pain that is new, getting worse or comes on at rest."

      - id: c03
        scene: case-side-woman
        options: [No cardiac test, CT coronary angiography, Exercise ECG, Stress echocardiogram]
        stem: "A 35-year-old woman with no cardiovascular risk factors has a sharp pain under her left breast at rest, lasting seconds and [[worse when she breathes in]]. Her resting ECG is normal."
        question: What is the next step?
        answer: No cardiac test
        hint: How many of the three features does her pain have?
        why: "Her pain is sharp, comes at rest and is worse when she breathes in, so it is non-anginal. With a normal resting ECG, no further testing is needed (NICE CG95), and another cause should be looked for."
        notes:
          "CT coronary angiography": "CT coronary angiography is for typical or atypical angina, or for non-anginal pain with an abnormal resting ECG."
          "Exercise ECG": "An exercise ECG is not the first-line investigation and is not used to diagnose angina in people without known coronary disease (NICE CG95)."
          "Stress echocardiogram": "A stress echocardiogram is correct if the patient has a history of coronary disease, or if CT coronary angiography is inconclusive."

      - id: c04
        scene: case-shoe-man
        options: [Stress echocardiogram, CT coronary angiography, Invasive coronary angiography, Chest X-ray]
        stem: "A 66-year-old man [[had a coronary stent three years ago]]. He now has chest tightness when he walks fast, easing with rest."
        question: What is the next step?
        answer: Stress echocardiogram
        hint: Is there known coronary disease?
        why: "His stent means he has known coronary disease (narrowed vessels), so the question is whether this narrowing is causing ischaemic pain or not. A functional test such as a stress echocardiogram determines whether the symptoms are due to ischaemia (NICE CG95)."
        notes:
          "CT coronary angiography": "CT coronary angiography is for suspected angina in people without known coronary disease, as it detects arterial narrowing."
          "Invasive coronary angiography": "Invasive coronary angiography comes after functional imaging that is inconclusive."
          "Chest X-ray": "A chest X-ray does not show coronary disease or ischaemia."

      - id: c05
        scene: case-results-woman
        options: [Invasive coronary angiography, Exercise ECG, Repeat CT coronary angiography, Discharge]
        stem: "A 59-year-old woman has typical angina. CT coronary angiography shows narrowing of uncertain significance, and a [[stress perfusion MRI is inconclusive]]."
        question: What is the next step?
        answer: Invasive coronary angiography
        hint: What comes after functional imaging that does not decide it?
        why: "CT coronary angiography showed narrowing of uncertain significance, so she had functional imaging, which was inconclusive. The next step is invasive coronary angiography (NICE CG95)."
        notes:
          "Exercise ECG": "An exercise ECG is not used to diagnose angina in people without known coronary disease and is not the first-line investigation (NICE CG95)."
          "Repeat CT coronary angiography": "Repeat CT coronary angiography would show the same uncertain narrowing and add nothing."
          "Discharge": "Discharge would leave her typical angina undiagnosed and untreated."

      - id: c06
        scene: case-request-man
        options: [Dobutamine, Adenosine, Dipyridamole]
        stem: "A 70-year-old man with known coronary disease and [[a history of asthma]] needs a functional test to find whether a narrowing causes his chest pain."
        question: Which stress agent should be used?
        answer: Dobutamine
        hint: Which agents can tighten the airways?
        why: "His asthma rules out adenosine and dipyridamole, as both can cause bronchospasm. Dobutamine raises the heart rate and the force of contraction, as exercise does, so it is the agent to use, usually with a stress echocardiogram."
        notes:
          "Adenosine": "Adenosine dilates the coronary arteries but can cause bronchospasm, so it is avoided in asthma."
          "Dipyridamole": "Dipyridamole works by raising adenosine levels and can cause bronchospasm, so it is avoided in asthma."

      - id: c07
        scene: case-lens-woman
        options: [Microvascular angina, Vasospastic angina, Hypertrophic cardiomyopathy, Pericarditis]
        stem: "A 54-year-old woman has typical angina. A stress echocardiogram shows [[ischaemia on exertion]], but invasive angiography shows clear coronary arteries."
        question: What is the most likely diagnosis?
        answer: Microvascular angina
        hint: Where can the blood flow fail if the large arteries are clear?
        why: "Ischaemia on exertion with clear coronary arteries on angiography means the blood flow fails in the small vessels of the heart. This is microvascular angina, also called cardiac syndrome X (ESC 2024)."
        notes:
          "Vasospastic angina": "Vasospastic angina causes pain at rest, often early in the morning, with transient ST elevation."
          "Hypertrophic cardiomyopathy": "Hypertrophic cardiomyopathy would show a thick septum on the echocardiogram, with an ejection systolic murmur that gets louder with Valsalva."
          "Pericarditis": "Pericarditis would cause sharp pain that is worse lying flat, with widespread ST elevation and PR depression."

      - id: c08
        scene: case-handbag-woman
        options: [Vasospastic angina, Microvascular angina, Stable angina, Pericarditis]
        stem: "A 38-year-old woman who smokes wakes at 05:00 with chest pain at rest. Her ECG during the pain shows [[transient ST elevation]]; coronary angiography is normal."
        question: What is the most likely diagnosis?
        answer: Vasospastic angina
        hint: Pain at rest, at dawn, with ST elevation that comes and goes?
        why: "Chest pain at rest in the early morning, with transient ST elevation and a normal angiogram, is vasospastic (Prinzmetal) angina. The coronary artery goes into spasm and briefly closes, then opens again; smoking is a known trigger (ESC 2024)."
        notes:
          "Microvascular angina": "Microvascular angina causes pain on exertion, with ST depression and clear coronary arteries."
          "Stable angina": "Stable angina comes on with exertion, eases with rest and shows arterial narrowing on coronary angiography."
          "Pericarditis": "Pericarditis would cause sharp pain that is worse lying flat, with widespread ST elevation and PR depression."
  - id: end
    pattern: end
    title: Your score
    title_ar: نتيجتك

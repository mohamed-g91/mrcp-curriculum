# Cardiology lesson 3. Approved plan: notes/angina-treatment-plan.md (2026-10-16).
# Clinical sources checked 2026-10-16; the built lesson and new Arabic remain drafts for author review.
# One patient: 61, diabetes/hypertension/smoking, 70% proximal LAD, bisoprolol 10 mg,
# sinus pulse 52, BP 132/80, preserved LV function. Dose is limited by rate, not the licensed maximum.
# ISMN example is product-specific: immediate-release product 102388, doses eight hours apart.
id: cardio.angina-treatment
title: Treating stable angina
title_ar: علاج الذبحة الصدرية المستقرة
description: Which drug now, which next, which combinations to avoid, and what protects the heart? Follow one patient from symptom relief to prevention, then practise on original exam-style cases.
status: draft
updated: 2026-10-16
sources:
  - "NICE CG126. Stable angina: management, recommendations 1.3.3–1.3.8, 1.4.5–1.4.14, 1.5.1–1.5.2, 1.8.3 (checked 2026-10-16). https://www.nice.org.uk/guidance/cg126/chapter/Recommendations"
  - "NICE NG238. Lipid modification, recommendations 1.7.2–1.7.3 (checked 2026-10-16). https://www.nice.org.uk/guidance/ng238/chapter/recommendations"
  - "MHRA. Ivabradine in angina: risk of cardiac side effects, 2014 (checked 2026-10-16). https://www.gov.uk/drug-safety-update/ivabradine-procoralan-in-the-symptomatic-treatment-of-angina-risk-of-cardiac-side-effects"
  - "MHRA. Nicorandil: second-line treatment and ulcer complications, 2016 (checked 2026-10-16). https://www.gov.uk/drug-safety-update/nicorandil-ikorel-now-second-line-treatment-for-angina-risk-of-ulcer-complications"
  - "SmPC. Isosorbide mononitrate 20 mg immediate-release tablets, 4.2 (checked 2026-10-16). https://www.medicines.org.uk/emc/product/102388/smpc"
  - "SmPC. Bisoprolol 5 mg, angina dosing (checked 2026-10-16). https://www.medicines.org.uk/emc/product/14147/smpc"
  - "SmPC. Atenolol 50 mg, angina dosing (checked 2026-10-16). https://www.medicines.org.uk/emc/product/14294/smpc"
  - "SmPC. Ivabradine: sinus rhythm, rate threshold, interactions and phosphenes (checked 2026-10-16). https://www.medicines.org.uk/emc/product/15015/smpc"
  - "SmPC. Nicorandil: PDE5 inhibitors (checked 2026-10-16). https://www.medicines.org.uk/emc/product/12663/smpc"
  - "SmPC. GTN spray: NO/cGMP and PDE5 interaction (checked 2026-10-16). https://www.medicines.org.uk/emc/product/11759/smpc"
  - "SmPC. Ranolazine: late sodium current and QT (checked 2026-10-16). https://www.medicines.org.uk/emc/product/15795/smpc"
  - "NICE NG106. Avoid verapamil/diltiazem in HFrEF (checked 2026-10-16). https://www.nice.org.uk/guidance/ng106/chapter/recommendations"
  - "Vrints C et al. 2024 ESC Guidelines for chronic coronary syndromes. Eur Heart J 2024;45:3415–3537. Sections 4.2 and 5.2: symptom drugs, PCI antiplatelets and ANOCA/INOCA. https://doi.org/10.1093/eurheartj/ehae177"

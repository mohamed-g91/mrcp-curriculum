  - id: alternatives
    pattern: reveal-cards
    title: The spare keys
    title_ar: الأدوية البديلة
    blind: true
    cards:
      - family: gray
        label: When?
        ar: متى؟
        icon: book
        answer: "Neither first-line class suitable: consider monotherapy. One insufficient, other unsuitable: consider add-on."
      - concept: nitrate
        ar: النترات
        icon: artery
        answer: "ISMN (immediate release): 08:00 and 16:00. Nitrate-low night. No PDE5 inhibitors."
      - concept: nico
        ar: نيكورانديل
        icon: artery

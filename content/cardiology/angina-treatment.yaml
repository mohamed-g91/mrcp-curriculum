  cat: يُبطئ القلب
  se: يوسّع الأوعية
  np: الوقاية
  gray: محايد
concepts:
  bb:      { label: Beta-blocker,          ar: حاصرات بيتا,                    family: cat,  letter: B, icon: narrow }
  rlccb:   { label: Rate-limiting CCB,     ar: حاصرات الكالسيوم المُبطئة,      family: cat,  letter: C, icon: narrow, cover: false }
  iva:     { label: Ivabradine,            ar: إيفابرادين,                     family: cat,  letter: I, icon: bulb, cover: false }
  dhp:     { label: Dihydropyridine CCB,   ar: حاصرات الكالسيوم الموسّعة,      family: se,   letter: D, icon: artery }
  nitrate: { label: Nitrate,               ar: النترات,                        family: se,   letter: N, icon: artery, cover: false }
  nico:    { label: Nicorandil,            ar: نيكورانديل,                     family: se,   letter: K, icon: artery, cover: false }
  rano:    { label: Ranolazine,            ar: رانولازين,                      family: gray, letter: R, icon: tag }
  aspirin: { label: Aspirin,               ar: الأسبرين,                       family: np,   letter: A, icon: check }
  statin:  { label: Statin,                ar: الستاتين,                       family: np,   letter: S, icon: check, cover: false }

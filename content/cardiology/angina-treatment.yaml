learn:
  - id: hook
    pattern: hook
    title: Which drug next?
    title_ar: أي دواء بعد ذلك؟
    scene: case-chest-man
    # Worded as the author set it (2026-10-17): the history, not the diagnosis; the drugs he is on, not "despite".
    stem: "A 61-year-old patient with diabetes, hypertension and IHD presented to the clinic with chest pain twice a week on climbing a hill, relieved by sublingual GTN within 5 minutes. On examination his heart rate is 52 and BP 132/80 mmHg, with preserved LV function. He is currently on GTN, aspirin, atorvastatin, bisoprolol 10 mg and ramipril 2.5 mg."
    question: What is the best next step in management?

  # The order agreed with the author 2026-10-16: two goals, then symptom relief step by step, then protecting the heart.
  - id: goals
    pattern: story
    title: Two goals
    title_ar: هدفان
    kind: art
    art: at-goals

  - id: gtn
    pattern: story
    title: "Relief now: GTN"
    title_ar: الراحة الفورية بالنترات
    kind: art
    art: at-gtn

  - id: first
    pattern: story
    title: The first drug
    title_ar: الدواء الأول
    kind: art
    art: at-first
    slots: { bb: "{bb}" }

  - id: titrate
    pattern: story
    title: Up to the highest tolerated dose
    title_ar: حتى أعلى جرعة محتملة
    kind: art
    art: at-titrate
    slots: { bb: "{bb}" }

  - id: addon
    pattern: story
    title: The add-on
    title_ar: الدواء الإضافي
    kind: art
    art: at-addon
    slots: { bb: "{bb}", dhp: "{dhp}", rlccb: "{rlccb}" }

  # Layout B, chosen 2026-10-17: When? a strip whose two points open on a tap; four drug cards; the tapped drug's
  # mechanism (one short line, the author's wording) and its catch open in the tray under the row.
  - id: alternatives
    pattern: reveal-cards
    title: The spare drugs
    title_ar: الأدوية البديلة
    blind: true
    tray: true
    strip:
      label: When?
      ar: متى؟
      icon: book
      points:
        - "**Monotherapy**: neither a beta-blocker nor a CCB is suitable"
        - "**Add-on**: one is not enough and the other is unsuitable"
    cards:
      - concept: nitrate
        ar: النترات
        figure: at-spare-nitrate
        mech: "NO"
        how: "Releases nitric oxide → ↑cGMP → venodilation → ↓preload"
        answer: "Nitrate-low night, so no tolerance. No PDE5 inhibitors."
      - concept: nico
        ar: نيكورانديل
        figure: at-spare-nico
        mech: "K_{ATP} + NO"
        how: "Opens K_{ATP} channels and releases nitric oxide → arterial and venous dilation"
        answer: "Ulcers anywhere in the gut: stop it. No PDE5 inhibitors."
      - concept: iva
        ar: إيفابرادين
        figure: at-spare-iva
        mech: "I*f*"
        how: "Blocks I*f* (funny current) in the SA node → ↓heart rate only"
        answer: "Phosphenes (flashes of light). Sinus rhythm, pulse ≥70."
      - concept: rano
        ar: رانولازين
        figure: at-spare-rano
        mech: "Late Na⁺"
        how: "Blocks late Na⁺ current → less Ca²⁺ overload → better relaxation, ↓O₂ demand"
        answer: "Long QT."

  - id: escalation
    pattern: story
    title: Still symptomatic?
    title_ar: هل تستمر الأعراض؟
    kind: art
    art: at-escalation

  - id: prevention
    pattern: story
    title: Protect the heart
    title_ar: الوقاية الثانوية
    kind: art
    art: at-protect

  - id: normal
    pattern: story
    title: Angina with a normal angiogram
    title_ar: ذبحة مع تصوير شرايين طبيعي
    kind: art
    art: at-normal

  - id: solve
    pattern: story
    title: Back to the hook
    title_ar: العودة إلى الحالة
    kind: art
    art: at-solve

practise:
  - id: cases
    pattern: stem-quiz
    title: Which treatment?
    title_ar: أي علاج؟
    options: [bb, rlccb, dhp, nitrate]
    cases:
      - id: c01
        solved: true
        scene: case-chest-man
        options: [Amlodipine, Verapamil, Increase bisoprolol, Isosorbide mononitrate]
        stem: "A 61-year-old patient with diabetes, hypertension and IHD has chest pain twice a week on climbing a hill, relieved by sublingual GTN within 5 minutes. [[Heart rate 52]], BP 132/80 mmHg, preserved LV function. He is on GTN, aspirin, atorvastatin, bisoprolol 10 mg and ramipril 2.5 mg."
        question: What is the best next step in management?
        answer: Amlodipine
        hint: Can the pulse fall further? Which CCB can be combined with a beta-blocker?
        why: "His heart rate of 52 means bisoprolol cannot be increased further, even though the licensed maximum in angina is 20 mg a day. The next step is to add a dihydropyridine calcium channel blocker such as amlodipine, which can be safely combined with a beta-blocker (NICE CG126)."
        notes:
          "Verapamil": "Verapamil is a rate-limiting calcium channel blocker, so with a beta-blocker it would risk bradycardia, AV block or worsening of pre-existing heart failure."
          "Increase bisoprolol": "A higher dose of bisoprolol would slow a pulse that is already 52 beats per minute."
          "Isosorbide mononitrate": "Isosorbide mononitrate is an add-on for when a calcium channel blocker cannot be used."
        tutor: "Titrate the current drug to the maximum tolerated dose first, then add a second drug."

      - id: c02
        scene: case-script-man
        options: [Bisoprolol, Isosorbide mononitrate, Nicorandil, Ivabradine]
        stem: "A 58-year-old man has newly confirmed stable angina. He has no significant past medical history. On examination, his heart rate is 78 and regular, and his BP is 138/80 mmHg. He takes sublingual GTN for acute relief of attacks, aspirin and atorvastatin, but [[no regular anti-anginal drug]]."
        question: Which listed drug is a first-line regular treatment?
        answer: Bisoprolol
        hint: Which of these belongs to a first-line class?
        why: "He has newly confirmed stable angina and no regular anti-anginal drug, so he needs a first-line drug. NICE offers either a beta-blocker or a calcium channel blocker first line (NICE CG126)."
        notes:
          "Isosorbide mononitrate": "Isosorbide mononitrate is not a routine first-line drug when a beta-blocker or calcium channel blocker is suitable."
          "Nicorandil": "Nicorandil is kept for when first-line drugs do not control symptoms, are not tolerated or are contraindicated."
          "Ivabradine": "Ivabradine is not a first-line drug, even when the pulse is above 70."

      - id: c03
        scene: case-script-woman
        options: [Verapamil, Bisoprolol, Nicorandil, Isosorbide mononitrate]
        stem: "A 55-year-old woman has newly confirmed stable angina. She has [[a past medical history of asthma on regular inhalers]]. On examination, her heart rate is 82 and regular, and her BP is 142/84 mmHg."
        question: Which listed regular treatment is most appropriate first line?
        answer: Verapamil
        hint: Which first-line option fits her airway disease and cardiac function?
        why: "Her history of asthma makes a calcium channel blocker a better first-line choice than a beta-blocker (NICE CG126)."
        notes:
          "Bisoprolol": "Bisoprolol is a first-line drug, but her history of asthma makes a calcium channel blocker the right choice."
          "Nicorandil": "Nicorandil is a second-line drug, kept for when first-line drugs cannot be used."
          "Isosorbide mononitrate": "Isosorbide mononitrate is used when routine first-line drugs are unsuitable."

      - id: c04
        scene: case-blister-man
        options: [Increase atenolol, Add amlodipine, Add verapamil, Add nicorandil]
        stem: "A 62-year-old man with a history of ischaemic heart disease has recurrent attacks of exertional chest pain, relieved by GTN within a couple of minutes. On examination, his heart rate is 80 and regular, and his BP is 146/82 mmHg. His medications are [[atenolol 25 mg daily]], aspirin 75 mg, sublingual GTN and atorvastatin."
        question: How should his anti-anginal treatment first be optimised?
        answer: Increase atenolol
        hint: Has the first drug reached his highest tolerated dose?
        why: "Atenolol 25 mg is not his maximum tolerated dose. The first drug should be increased to the maximum tolerated dose before another is added, with a review in 2 to 4 weeks (NICE CG126); the usual atenolol dose in angina is 100 mg a day."
        notes:
          "Add amlodipine": "Amlodipine is a suitable add-on, but only once atenolol is at the highest tolerated dose."
          "Add verapamil": "Verapamil should not be combined with a beta-blocker, as it risks bradycardia, AV block and heart failure."
          "Add nicorandil": "Nicorandil is a second-line drug, used only after first-line treatment has been optimised and another first-line drug cannot be added."

      - id: c05
        scene: case-bottle-man
        options: [Nicorandil, Bisoprolol, Ivabradine, Diltiazem]
        stem: "A 67-year-old man with stable angina remains symptomatic on the maximum tolerated dose of [[verapamil]]. A beta-blocker was stopped before because of recurrent bronchospasm."
        question: Which listed drug is a suitable add-on?
        answer: Nicorandil
        hint: Which option can accompany verapamil without adding unsafe rate reduction?
        why: "He is still symptomatic on the highest tolerated dose of verapamil, and a beta-blocker caused bronchospasm. Nicorandil can be added to verapamil without slowing the heart further (NICE CG126); warn him about ulcers and stop it if they occur."
        notes:
          "Bisoprolol": "Bisoprolol caused bronchospasm before, and with verapamil it would risk bradycardia and AV block."
          "Ivabradine": "Ivabradine is contraindicated with verapamil."
          "Diltiazem": "Diltiazem is another rate-limiting calcium channel blocker, like verapamil, and the two should not be combined."

      - id: c06
        scene: case-water-man
        options: [Doses at 08:00 and 16:00, Double each dose, Add a GTN patch at night, Add a third dose at 14:00]
        stem: "A man with ischaemic heart disease takes bisoprolol 10 mg daily and immediate-release ISMN 20 mg at [[08:00 and 20:00]]. His chest pain improved markedly when ISMN was started, but over the past 3 months the same effort brings it on again, and he has needed his sublingual GTN more than once. The pain responds rapidly to GTN, and there is no pain at rest."
        question: Which schedule change best addresses possible nitrate tolerance?
        answer: Doses at 08:00 and 16:00
        hint: Does each day include a sufficiently low nitrate exposure?
        why: "Taking immediate-release ISMN every 12 hours keeps nitrate levels up day and night, which causes tolerance. Taking the second dose 6 to 8 hours after the first leaves a nitrate-free interval overnight, which prevents tolerance (SmPC). A modified-release tablet can be taken once a day instead."
        notes:
          "Double each dose": "Doubling each dose would not solve the tolerance problem."
          "Add a GTN patch at night": "A GTN patch at night would remove the nitrate-low interval overnight."
          "Add a third dose at 14:00": "A third dose at 14:00 would shorten the nitrate-low interval and make tolerance worse."

      - id: c07
        scene: case-medbag-man
        options: [Nicorandil, Amlodipine, Bisoprolol, Isosorbide mononitrate]
        stem: "A 71-year-old man taking several drugs for stable angina develops a persistent [[painful perianal ulcer]]. Conventional local treatment has not helped."
        question: Which listed drug is the most likely cause?
        answer: Nicorandil
        hint: Which anti-anginal is associated with mucosal ulceration?
        why: "A persistent painful perianal ulcer in a patient on angina drugs points to nicorandil, which can cause ulcers anywhere in the gut, as well as on the skin and in the eye (MHRA 2016). Nicorandil should be stopped and his angina treatment reviewed."
        notes:
          "Amlodipine": "Amlodipine typically causes ankle swelling, flushing or headache."
          "Bisoprolol": "Bisoprolol typically causes bradycardia or tiredness."
          "Isosorbide mononitrate": "Isosorbide mononitrate typically causes headache, flushing or low blood pressure."

      - id: c08
        scene: case-box-woman
        options: [Ivabradine, Nicorandil, Amlodipine, Ranolazine]
        stem: "A 60-year-old woman with stable angina notices brief [[flashes of light when moving into dim light]] after a new anti-anginal drug was started."
        question: Which drug most likely explains this effect?
        answer: Ivabradine
        hint: Which drug causes phosphenes?
        why: "Brief flashes of light in dim light are phosphenes, a known side effect of ivabradine, which blocks the If current in the sinus node. Ivabradine is used in angina only in sinus rhythm with a resting rate of at least 70 when it is started (SmPC)."
        notes:
          "Nicorandil": "Nicorandil typically causes ulcers in the gut, on the skin or in the eye."
          "Amlodipine": "Amlodipine typically causes ankle swelling, flushing or headache."
          "Ranolazine": "Ranolazine's main caution is QT prolongation."

      - id: c09
        scene: case-bp-man
        options: [Nifedipine MR, Isosorbide mononitrate, Nicorandil, Verapamil]
        stem: "A 64-year-old man has persistent stable angina symptoms on the maximum tolerated dose of bisoprolol. On examination, his heart rate is 56 and his BP is 134/80 mmHg. He regularly takes [[sildenafil]]."
        question: Which listed drug can be added?
        answer: Nifedipine MR
        hint: Avoid the PDE5 interaction and unsafe additional rate slowing.
        why: "Sildenafil rules out nitrates and nicorandil, as the combination can cause severe hypotension (SmPC). A modified-release dihydropyridine calcium channel blocker such as nifedipine MR can be safely added to bisoprolol (NICE CG126)."
        notes:
          "Isosorbide mononitrate": "Isosorbide mononitrate is contraindicated with sildenafil, as together they can cause severe hypotension."
          "Nicorandil": "Nicorandil has a nitrate action, so it is also contraindicated with sildenafil."
          "Verapamil": "Verapamil with bisoprolol risks bradycardia, AV block and heart failure."

      - id: c10
        scene: case-sort-man
        options: [Aspirin, GTN, Bisoprolol, Amlodipine]
        stem: "A 59-year-old man with [[no past medical history]] has stable angina due to coronary atherosclerosis."
        question: Which listed drug is used for event prevention?
        answer: Aspirin
        hint: Which acts on thrombosis rather than simply easing angina?
        why: "Aspirin prevents cardiovascular events in atherosclerotic coronary disease, with bleeding risk taken into account (NICE CG126). GTN, bisoprolol and amlodipine relieve his symptoms; a beta-blocker also prevents events only after an MI or in heart failure with reduced ejection fraction."
        notes:
          "GTN": "GTN treats or prevents episodes of pain but does not reduce the rate of cardiovascular events."
          "Bisoprolol": "Bisoprolol relieves angina by lowering the heart's oxygen demand; it prevents events only after an MI or in heart failure with reduced ejection fraction."
          "Amlodipine": "Amlodipine relieves angina but does not prevent cardiovascular events such as MI."

      - id: c11
        scene: case-bottle-woman
        options: [Ramipril, Nicorandil, Ivabradine, Isosorbide mononitrate]
        stem: "A 63-year-old woman has stable angina and [[type 2 diabetes]]. She takes aspirin and atorvastatin. Her BP, creatinine and potassium are within the normal range."
        question: Which listed drug should be considered for cardiovascular prevention?
        answer: Ramipril
        hint: Which option is an ACE inhibitor?
        why: "In stable angina with diabetes, NICE says to consider an ACE inhibitor for prevention, and ramipril is the only ACE inhibitor listed (NICE CG126). It is started after checking the blood pressure, creatinine and potassium."
        notes:
          "Nicorandil": "Nicorandil is a second-line drug for symptoms, not for prevention."
          "Ivabradine": "Ivabradine lowers the heart rate to relieve symptoms in eligible patients; it does not prevent events."
          "Isosorbide mononitrate": "Isosorbide mononitrate relieves symptoms; it does not prevent events."

      - id: c12
        scene: case-spray-man
        options: [Call an ambulance, Take a third GTN dose and wait, Rest for another 30 minutes, Double the GTN dose]
        stem: "A man with established angina develops chest pain. He takes sublingual GTN, then a second dose five minutes later because pain persists. [[Five minutes after the second dose, the pain is still present]]."
        question: What should he do now?
        answer: Call an ambulance
        hint: How long has the pain persisted after the second dose?
        why: "Pain that is still present 5 minutes after a second dose of GTN needs an emergency ambulance (NICE CG126). It may be an acute coronary syndrome, so more self-treatment would only delay care."
        notes:
          "Take a third GTN dose and wait": "A third dose of GTN would delay emergency assessment of a possible acute coronary syndrome."
          "Rest for another 30 minutes": "Resting for another 30 minutes would delay emergency assessment."
          "Double the GTN dose": "Doubling the GTN dose would delay emergency assessment and may cause hypotension."

      - id: c13
        scene: case-stairs-man
        options: [Coronary angiography, Add ISMN, Add ivabradine, Add nicorandil]
        stem: "A 68-year-old man with stable angina takes bisoprolol and amlodipine at maximum tolerated doses with good adherence. He has [[limiting angina most days despite treatment]]."
        question: What is the next step?
        answer: Coronary angiography
        hint: What guides a revascularisation strategy after optimal drug treatment fails?
        why: "His angina still limits him despite the highest tolerated doses of two drugs, so optimal medical treatment has failed. Coronary angiography is offered to guide revascularisation by PCI or CABG (NICE CG126). A third drug is for patients waiting for revascularisation, or for whom it is unsuitable or declined."
        notes:
          "Add ISMN": "Isosorbide mononitrate as a third drug is considered while waiting for coronary angiography or revascularisation, or when revascularisation is unsuitable."
          "Add ivabradine": "Ivabradine as a third drug is considered while waiting for coronary angiography or revascularisation, or when revascularisation is unsuitable, and it needs sinus rhythm with a resting rate of at least 70."
          "Add nicorandil": "Nicorandil as a third drug is considered while waiting for coronary angiography or revascularisation, or when revascularisation is unsuitable."

      - id: c14
        scene: case-can-man
        options: [Continue current treatment, Add ISMN, Add ivabradine, Add nicorandil]
        stem: "A 68-year-old man with stable angina takes bisoprolol and amlodipine. His [[symptoms are well controlled]], and the treatment is tolerated."
        question: What change is needed to his symptom drugs?
        answer: Continue current treatment
        hint: Is a third anti-anginal needed when two control symptoms?
        why: "Two drugs control his symptoms well, so no third anti-anginal drug is added (NICE CG126), and his prevention treatment and follow-up continue. High-risk coronary anatomy, if found, could change the plan for revascularisation."
        notes:
          "Add ISMN": "Isosorbide mononitrate is not needed when two drugs control the symptoms well."
          "Add ivabradine": "Ivabradine as a third anti-anginal drug is not needed when two control the symptoms."
          "Add nicorandil": "Nicorandil would add the risk of side effects, such as ulcers, with no benefit."

      - id: c15
        scene: case-handbag-woman
        options: [Amlodipine, Bisoprolol, Aspirin and clopidogrel, PCI]
        stem: "A 38-year-old woman who smokes wakes at 05:00 with chest pain at rest. Her ECG during the pain shows [[transient ST elevation]], and coronary angiography shows no obstructive coronary disease."
        question: "What is the best first-line treatment?"
        answer: Amlodipine
        hint: Which drug relaxes the spastic artery?
        why: "Early-morning chest pain at rest with transient ST elevation and no obstructive coronary disease is vasospastic angina. A calcium channel blocker such as amlodipine relaxes the spastic artery and is first line, with a long-acting nitrate added if needed (ESC 2024). Stopping smoking is part of her treatment."
        notes:
          "Bisoprolol": "Bisoprolol, like other beta-blockers, is avoided in vasospastic angina, as it can make the spasm worse."
          "Aspirin and clopidogrel": "Aspirin and clopidogrel are not needed without atherosclerotic disease or a stent."
          "PCI": "PCI treats a fixed narrowing, and in vasospastic angina there is none to stent."
  - id: end
    pattern: end
    title: Your score
    title_ar: نتيجتك

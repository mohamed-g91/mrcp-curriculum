        answer: "75 mg daily. Assess bleeding risk and comorbidities."
      - concept: statin
        figure: at-prevention-statin
        answer: "Atorvastatin 80 mg. Lower dose if needed."
      - { family: np, label: Blood pressure, ar: ضغط الدم, figure: at-prevention-bp, answer: "Treat hypertension." }

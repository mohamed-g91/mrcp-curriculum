# Coronary arteries and the ECG: MRCP Part 1 cardiology. Lesson 1 of chapter A, coronary heart disease.
# The question: given the leads with ST changes, which wall is hurt and which artery is blocked?
# One patient runs through the lesson: a 62-year-old man, 40 minutes of central chest pain, pulse 42, BP 88/56,
# JVP raised, chest clear; ST elevation 2 mm in II, III and aVF, ST depression in I and aVL (V4R 1 mm, on slide 5 only).
# He is the RCA (slides 2 to 4), his mirror is I and aVL (slide 4), his pressure the right ventricle (5), his pulse the AV node (6).
# Checked 2026-10-13 against ESC 2023 ACS (3.2.1, 3.2.2, 4.2.2.2), Zimetbaum and Josephson (NEJM 2003) and de Zwaan et al. (1982);
# see notes/coronary-arteries-ecg-plan.md. Dominance and nodal supply vary by study, so the slides say "most hearts".
# IDs are permanent: never renumber or reuse one. To drop an item, move its ID to `retired`.

id: cardio.coronary-arteries-ecg
title: Coronary arteries and the ECG
title_ar: الشرايين التاجية وتخطيط القلب
description: Which artery is blocked? The three coronary arteries, the walls they feed, the leads that face each wall and their mirror. Learn from one patient with an inferior STEMI, then practise on exam-style ECG stems.
status: reviewed
updated: 2026-10-13
sources:
  - Byrne RA, Rossello X, Coughlan JJ, et al. 2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J 2023;44:3720–3826 (sections 3.2.1, 3.2.2, 4.2.2.2).
  - Zimetbaum PJ, Josephson ME. Use of the electrocardiogram in acute myocardial infarction. N Engl J Med 2003;348:933–40.
  - de Zwaan C, Bär FW, Wellens HJ. Characteristic electrocardiographic pattern indicating a critical stenosis high in left anterior descending coronary artery. Am Heart J 1982;103:730–6.
  - NICE NG185. Acute coronary syndromes, 2020.
  - Haji SA, Movahed A. Right ventricular infarction: diagnosis and treatment. Clin Cardiol 2000;23:473–82 (volume loading to keep the RV's preload).
  - Ibanez B, James S, Agewall S, et al. 2017 ESC Guidelines for the management of acute myocardial infarction in patients presenting with ST-segment elevation. Eur Heart J 2018;39:119–77 (8.2.2.1: in RV infarction, avoid volume overload).
retired: [c10]   # c10 (NSTEMI, T inversion in V5 and V6) removed by the user, 2026-10-17
cover: concepts

# One colour per artery; a wall takes its artery's colour on the 2D figures (the 3D heart lights every wall in one teal).
families:
  cat: LAD
  par: Circumflex
  se: RCA
  gray: Neutral
families_ar:
  cat: الأمامي النازل
  par: المنعطف
  se: التاجي الأيمن
  gray: محايد

concepts:
  lad: { label: LAD,        ar: الشريان الأمامي النازل الأيسر, family: cat, letter: L, icon: artery }
  lcx: { label: Circumflex, ar: الشريان المنعطف,              family: par, letter: C, icon: artery }
  rca: { label: RCA,        ar: الشريان التاجي الأيمن,         family: se,  letter: R, icon: artery }

learn:
  - id: hook
    at: "0:23"
    pattern: hook
    title: Which artery is blocked?
    title_ar: أي شريان مسدود؟
    stem: "A 62-year-old man has 40 minutes of central chest pain. Pulse 42, blood pressure 88/56 mmHg, JVP raised, chest clear. His ECG:"
    question: Which artery is blocked?
    figure: ecg-inferior

  # The slice across both ventricles (anterior at the top, the RV on the left), LV and RV named; every wall tapped on
  # its own lights in its artery's colour, and the card beside it names the wall and its artery (the user, 2026-10-13).
  # Rebuilt on Codex's whole heart from the front (art/make_heart_drawings.py), beside the slice: tapping an artery
  # names it and lights the walls it feeds (the user chose B, 2026-10-16). The left main lights the LAD's and the
  # circumflex's walls; its Arabic was approved 2026-10-16.
  - id: arteries
    at: "1:18"
    pattern: heart-slice
    image: heart-front
    image_box: [400, 0, 800, 900]   # where the WebP sits in the drawing's 1672 x 941 pixels
    # each artery: a concept (or a name of its own), its point on the drawing, where its name stands
    # (R or L column, at that height) and the walls it feeds
    arteries:
      - { key: lm, label: Left main, ar: الجذع الرئيسي الأيسر, family: gray, point: [772, 252], name: [R, 200], walls: [anterior, septal, lateral, posterior] }
      - { key: lad, point: [880, 452], name: [R, 470], walls: [anterior, septal] }
      - { key: lcx, point: [1000, 336], name: [R, 320], walls: [lateral, posterior] }
      - { key: rca, point: [552, 382], name: [L, 382], walls: [inferior, rv] }
    title: Three arteries
    title_ar: ثلاثة شرايين

  # The 3D heart: drag to turn it; a wall turns to face you, its leads with ST up, the mirror leads (dashed) with ST down.
  # The slice alone (art/make_heart_drawings.py: heart-section-a3 with the rest of the heart masked away), the leads
  # round it where they look from, as an echo's short axis shows it; a wall's button lights its own leads (dotted
  # lines to it) and its mirror (dashed, on through the heart) (the user chose C, 2026-10-16; it replaced the 3D heart)
  - id: turn
    at: "2:41"
    pattern: heart-slice
    mode: leads
    image: heart-cut
    image_box: [660, 330, 650, 530]   # where the WebP sits in the drawing's 1672 x 941 pixels
    view: [60, 220, 1440, 760]        # the part of that grid the slide shows (the patient on its left)
    # each wall's point on the drawing
    walls: { inferior: [1020, 725], septal: [890, 580], anterior: [1040, 395], lateral: [1205, 580], posterior: [1160, 690], rv: [697, 630] }
    # where each lead stands, round the slice: anterior up, inferior down, the septum and right ventricle left
    leads:
      V1: [614, 441]
      V2: [726, 335]
      V3: [911, 270]
      V4: [1099, 278]
      I: [1264, 350]
      aVL: [1372, 472]
      V5: [1402, 619]
      V6: [1361, 741]
      V7–V9: [1242, 857]
      II: [1071, 920]
      aVF: [897, 920]
      III: [738, 864]
      V4R: [571, 653]
      aVR: [560, 320]
    # Sol's line-drawn patient beside the slice (the user chose C, 2026-10-16), drawn bare: the page puts the
    # electrodes on him, in the drawing's 1086 x 1448 pixels. Chest: V1, V2 the 4th space either side of the sternum,
    # V4 the 5th space at the midclavicular line, V3 between, V5 and V6 level with V4 at the anterior and mid-axillary
    # lines; V4R mirrors V4 and shows only when the right ventricle is lit. Limbs: right and left wrist, right and left
    # ankle, never lit (the limb leads are each made from two or three of them)
    patient: patient-front
    patient_box: [180, 30, 720, 1370]   # where the WebP sits in his drawing's pixels
    patient_at: [70, 240, 720]           # where he stands in the slice's grid: left, top, height
    electrodes: { V1: [527, 398], V2: [557, 398], V3: [594, 421], V4: [628, 445], V5: [649, 447], V6: [667, 450], V4R: [452, 445] }
    limbs: [[272, 690], [806, 690], [438, 1272], [630, 1272]]
    title: Leads and walls
    title_ar: الأقطاب والجدران   # draft, awaiting the user's review (2026-10-16)

  # The same slice: a tapped wall shows its own leads (ST up) and its mirror leads across the heart (dashed, ST down).
  # Pairs: inferior / I, aVL; lateral / III, aVF; anterior / II, III, aVF (a sign of a proximal LAD); posterior: V7–V9
  # with its mirror in V1–V3 (ESC 2023, 3.2.1); septal and RV none (Zimetbaum and Josephson 2003).
  # On Codex's drawing of the heart cut across (art/make_heart_drawings.py), seen as on an echo's short axis: each tap
  # names the next wall, in the 3D slide's order, and shows its own leads and its mirror (the user chose B, 2026-10-15).
  - id: mirror
    at: "7:30"
    pattern: heart-slice
    mode: mirror
    image: heart-section
    image_box: [320, 0, 1020, 870]   # where the WebP sits in the drawing's 1672 x 941 pixels
    # each wall: its point on the drawing, then where its name stands: R or L, a column at that height; B, the bottom row at that x
    columns: {R: 1330, L: 560}
    walls:
      inferior:  [1020, 725, L, 880]
      septal:    [890, 580, L, 470]
      anterior:  [1040, 395, R, 330]
      lateral:   [1205, 580, R, 600]
      posterior: [1160, 690, R, 720]
      rv:        [697, 630, L, 780]
    # the wall each mirror faces: its leads' card stands beyond it, on one dashed line through the heart from the
    # wall's own card (inferior: I, aVL face the lateral wall; lateral and anterior: III / II, III, aVF the inferior;
    # posterior: V1–V3 face the front of the septum)
    faces: {inferior: lateral, lateral: inferior, anterior: inferior, posterior: [930, 430]}
    # the septum's card stands below the heart, so it does not cover the right ventricle
    card_at: {septal: [700, 830]}
    title: The mirror
    title_ar: المرآة

  - id: table
    at: "9:18"
    pattern: reveal-cards
    title: From ECG leads to artery
    title_ar: من رسم القلب إلى الشريان
    # closed cards show only the leads on a grey slice; the colour, the answer and the Arabic come when one opens
    blind: true
    cards:
      - { family: se,  figure: heart-card-inferior,  label: "II, III, aVF",        answer: "Inferior wall: the RCA (in most hearts)" }
      - { family: cat, figure: heart-card-anterior,  label: "V1–V4",               answer: "Septum and front wall: the LAD" }
      - { family: par, figure: heart-card-lateral,   label: "I, aVL, V5, V6",      answer: "Lateral wall: the circumflex" }
      - { family: cat, figure: heart-card-extensive, label: "V1–V6, I, aVL",       answer: "Front and side together: the proximal LAD or the left main" }
      # posterior MI shows only as its mirror in V1–V3; V7–V9 confirm it; usually the circumflex (ESC 2023, 3.2.1)
      - { family: par, figure: heart-card-posterior, label: "V1–V3, ST down",      answer: "Posterior wall, in its mirror: the circumflex" }

  # His pressure, as the right heart, the lungs and the left heart in a row (the user, 2026-10-13), a beat per tap:
  # a proximal RCA blockage starves the RV, which fails; blood dams back into the veins (JVP up, Kussmaul's sign);
  # little reaches the lungs, which stay clear; the LV runs dry and the BP falls (the triad); V4R shows ST elevation
  # (ESC 2023, 3.2.1); fluids and early reperfusion, never nitrates (ESC 2023, 4.2.2.2) or diuretics, which drop preload.
  - id: rv
    at: "10:30"
    pattern: story
    title: The right ventricle
    title_ar: البطين الأيمن
    kind: art
    art: heart-rv

  # MI and bradycardia, one slide (the user, 2026-10-13): inferior MI, the RCA's AV node, a narrow escape that usually
  # passes; then anterior MI, a septal infarct below the node (bundle branches), a wide slow escape, unstable, paced.
  # Bank: Mobitz II after anterior MI → temporary pacing; complete heart block after inferior MI, stable → observe.
  - id: slow
    at: "11:35"
    pattern: story
    title: MI and bradycardia
    title_ar: الاحتشاء وبطء القلب
    kind: art
    art: heart-brady

  # Back to the hook as an algorithm (the user, 2026-10-13): leads, then wall, then artery, each step lighting its words
  # in the stem; then the supporting clues point up into the artery (pulse 42: the AV node; low BP, raised JVP, clear
  # chest: the RV).
  - id: solve
    at: "13:44"
    pattern: story
    title: Back to the hook
    title_ar: العودة إلى الحالة
    kind: art
    art: heart-algorithm

practise:
  - id: cases
    pattern: stem-quiz
    title: Which artery?
    title_ar: أي شريان؟
    # concept options; cases that need Left main bring their own list
    options: [lad, lcx, rca]
    # The first case is the solved example; the rest are dealt in a random order.
    cases:
      - id: c01
        scene: case-chest-man
        options: [lad, lcx, rca, Left main]
        solved: true
        stem: "A 62-year-old man has had 40 minutes of central chest pain. His pulse is 42 and his blood pressure 88/56 mmHg. His ECG shows [[ST elevation in II, III and aVF]] with ST depression in I and aVL."
        question: Which artery is blocked?
        answer: rca
        hint: Which wall do II, III and aVF face?
        why: "Leads II, III and aVF face the inferior wall, which is supplied by the RCA in most hearts. The bradycardia is also due to AV node damage, as the AV node is also supplied by the RCA. The ST depression in I and aVL is a reciprocal change."
        notes:
          "lad": "The LAD artery supplies the anterior and septal walls, so it would cause ST elevation in V1–V4."
          "lcx": "The circumflex artery supplies the lateral wall, so it would cause ST elevation in I, aVL, V5 and V6."
          "Left main": "The left main artery supplies most of the left ventricle, so it would cause ST elevation in aVR with ST depression in six or more leads."
        tutor: "Read the leads first, then identify the wall they face, then the artery that supplies it: leads II, III and aVF face the inferior wall, which is supplied by the RCA."

      - id: c02
        scene: case-chest-woman
        options: [lad, lcx, rca, Left main]
        stem: "A 55-year-old woman has crushing chest pain. Her ECG shows [[ST elevation in V1 to V4]] with ST depression in II, III and aVF."
        question: Which artery is blocked?
        answer: lad
        hint: Which walls do V1 to V4 face?
        why: "Leads V1–V4 face the septal and anterior walls, which are supplied by the LAD artery. The ST depression in II, III and aVF is a reciprocal change."
        notes:
          "rca": "The RCA supplies the inferior wall, so it would cause ST elevation in II, III and aVF."
          "lcx": "The circumflex artery supplies the lateral wall, so it would cause ST elevation in I, aVL, V5 and V6."
          "Left main": "The left main artery supplies most of the left ventricle, so it would cause ST elevation in aVR with ST depression in six or more leads."

      - id: c03
        scene: case-arm-man
        options: [lad, lcx, rca, Left main]
        stem: "A 68-year-old man has chest pain radiating to his left arm. His ECG shows [[ST elevation in I, aVL, V5 and V6]] with ST depression in III and aVF."
        question: Which artery is blocked?
        answer: lcx
        hint: Which wall do I, aVL, V5 and V6 face?
        why: "Leads I, aVL, V5 and V6 face the lateral wall, which is supplied by the circumflex artery. The ST depression in III and aVF is a reciprocal change."
        notes:
          "lad": "The LAD artery supplies the anterior and septal walls, so it would cause ST elevation in V1–V4."
          "rca": "The RCA supplies the inferior wall, so it would cause ST elevation in II, III and aVF."
          "Left main": "The left main artery supplies most of the left ventricle, so it would cause ST elevation in aVR with ST depression in six or more leads."

      - id: c04
        scene: case-breathless-man
        options: [Proximal LAD, Distal LAD, lcx, rca]
        stem: "A 49-year-old man is pale and breathless with chest pain. His ECG shows [[ST elevation from V1 to V6 and in I and aVL]]."
        question: Where is the blockage?
        answer: Proximal LAD
        hint: How many walls are involved?
        why: "ST elevation from V1 to V6 and in I and aVL means the septal, anterior and lateral walls are all injured. A blockage in the proximal LAD artery, before its septal and first diagonal branches, affects all three walls. A left main artery blockage can also cause this pattern."
        notes:
          "Distal LAD": "A distal LAD blockage spares the septal and first diagonal branches, so it would cause ST elevation in V3–V4 (anterior wall) and V5–V6 (the low lateral wall near the apex), but not in V1 (septal wall, supplied by the septal branches) or I and aVL (high lateral wall, supplied mainly by the circumflex artery, with part supplied by the first diagonal branch of the LAD artery)."
          "lcx": "The circumflex artery supplies the lateral wall, so it would cause ST elevation in I, aVL, V5 and V6 without V1–V4."
          "rca": "The RCA supplies the inferior wall, so it would cause ST elevation in II, III and aVF."

      - id: c05
        scene: case-ecg-woman
        options: [Posterior leads V7–V9, Right-sided leads V3R–V4R, Repeat troponin in 3 hours, Echocardiogram]
        stem: "A 71-year-old woman has ongoing central chest pain. Her ECG shows [[ST depression in V1 to V3 with tall R waves and upright T waves]]."
        question: What is the next step?
        answer: Posterior leads V7–V9
        hint: Which wall has no lead facing it on a standard ECG?
        why: "ST depression in V1–V3 with tall R waves and upright T waves is the reciprocal of a posterior STEMI, because no standard lead faces the posterior wall. Posterior leads V7–V9 confirm it by showing ST elevation; it is usually caused by a circumflex artery blockage (ESC 2023). Reading this as an NSTEMI would delay reperfusion."
        notes:
          "Right-sided leads V3R–V4R": "Right-sided leads V3R–V4R look for right ventricular infarction, which comes with an inferior STEMI, not with changes in V1–V3."
          "Repeat troponin in 3 hours": "A repeat troponin in 3 hours would delay reperfusion of a possible STEMI."
          "Echocardiogram": "An echocardiogram may show a wall that is not moving, but it cannot diagnose a STEMI or replace the posterior leads."

      - id: c06
        scene: case-bp-man
        options: [Glyceryl trinitrate, Aspirin, Morphine, IV fluids]
        stem: "A 60-year-old man has an inferior STEMI. His blood pressure is 84/50 mmHg, his [[JVP is raised and his chest is clear]]. V4R shows 1 mm ST elevation."
        question: Which drug should be avoided?
        answer: Glyceryl trinitrate
        hint: What does the right ventricle depend on when it is starved?
        why: "Hypotension, a raised JVP and a clear chest with an inferior STEMI point to right ventricular infarction, which the ST elevation in V4R confirms. The injured right ventricle depends on its filling pressure (preload). Nitrates lower the preload through venodilation, so the blood pressure falls further (ESC 2023)."
        notes:
          "Aspirin": "Aspirin is given in every STEMI and does not lower the blood pressure."
          "Morphine": "Morphine can be given in small doses for severe pain."
          "IV fluids": "IV fluids are given with care to raise the preload."

      - id: c07
        scene: case-tube-man
        options: [Critical proximal LAD stenosis, Old anterior infarct, Pericarditis, Left ventricular hypertrophy]
        stem: "A 52-year-old man had chest pain yesterday and is now pain-free. His ECG shows [[deep, symmetrical T-wave inversion in V2 and V3]]; his troponin is just above the upper limit."
        question: What does the ECG show?
        answer: Critical proximal LAD stenosis
        hint: The patient is pain-free now. What is about to happen?
        why: "Deep, symmetrical T-wave inversion in V2 and V3 after chest pain is Wellens' pattern, caused by a critical stenosis in the proximal LAD artery (ESC 2023). Being pain-free does not mean he is safe, as the artery may occlude at any moment. He needs angiography, as a stress test could cause a myocardial infarction."
        notes:
          "Old anterior infarct": "An old anterior infarct would show Q waves in V1–V4, without recent chest pain."
          "Pericarditis": "Pericarditis would cause widespread ST elevation with PR depression."
          "Left ventricular hypertrophy": "Left ventricular hypertrophy would cause tall QRS complexes, with ST depression and T-wave inversion in the lateral leads (strain)."

      - id: c08
        scene: case-ecg-woman
        options: [I and aVL, V1–V3, V5 and V6, aVR]
        stem: "A 66-year-old woman has an [[inferior STEMI]] with ST elevation in II, III and aVF."
        question: Where is the reciprocal ST depression most likely?
        answer: I and aVL
        hint: Which leads look at the heart from the opposite side?
        why: "Leads I and aVL look at the heart from the upper left, opposite the inferior wall, so they show its injury as ST depression. These reciprocal changes support a true inferior STEMI."
        notes:
          "V1–V3": "V1–V3 show ST depression as the reciprocal of a posterior STEMI."
          "V5 and V6": "V5 and V6 would show ST elevation, not depression, if the infarct spread to the lateral wall."
          "aVR": "aVR shows ST elevation, with widespread ST depression, in left main disease."

      - id: c09
        scene: case-watch-man
        options: [lad, lcx, rca, Left main]
        stem: "A 74-year-old man has chest pain and a pulse of 38. His ECG shows [[complete heart block with a narrow QRS]] and ST elevation in II, III and aVF."
        question: Which artery is blocked?
        answer: rca
        hint: Which artery feeds the AV node in most hearts?
        why: "Leads II, III and aVF face the inferior wall, which is supplied by the RCA in most hearts. The heart block is also due to AV node damage, as the AV node is also supplied by the RCA. The narrow QRS means a junctional escape rhythm, which is usually benign and managed by treating the cause (reperfusion)."
        notes:
          "lad": "The LAD artery supplies the anterior and septal walls, so it would cause ST elevation in V1–V4, with a wide-QRS bradycardia due to a ventricular escape rhythm, which usually needs pacing."
          "lcx": "The circumflex artery supplies the lateral wall, so it would cause ST elevation in I, aVL, V5 and V6; it supplies the AV node only in left-dominant hearts, which are uncommon."
          "Left main": "The left main artery supplies most of the left ventricle, so it would cause ST elevation in aVR with ST depression in six or more leads."

      - id: c11
        scene: case-oxygen-man
        twist: true
        options: [Left main, lad, lcx, rca]
        stem: "A 77-year-old man is breathless and hypotensive with chest pain. His ECG shows [[ST elevation in aVR with ST depression in six or more leads]]."
        question: Which artery is most likely blocked?
        answer: Left main
        hint: What does widespread depression with ST elevation in aVR suggest?
        why: "ST elevation in aVR with ST depression in six or more leads suggests left main or three-vessel disease, especially with hypotension, as in our case. The depression reflects widespread ischaemia, so it does not point to a single wall. He needs urgent angiography."
        notes:
          "lad": "The LAD artery supplies the anterior and septal walls, so it would cause ST elevation in V1–V4."
          "lcx": "The circumflex artery supplies the lateral wall, so it would cause ST elevation in I, aVL, V5 and V6."
          "rca": "The RCA supplies the inferior wall, so it would cause ST elevation in II, III and aVF."
  - id: end
    pattern: end
    title: Your score
    title_ar: نتيجتك

# The curriculum spine: specialties, their topics, and where each topic lives.
# A topic's content is in content/<specialty>/<slug>.yaml and builds to dist/<specialty>/<slug>.html.
# Topic IDs are permanent (<prefix>.<slug>). status: planned | draft | reviewed | published
# video: the YouTube video ID once the video is live.

site:
  title: MRCP Gafar
  tagline: Internal Medicine Education
  author: Mohamed Gafar
  disclaimer: Not affiliated with the Royal College of Physicians

specialties:
  - id: statistics
    prefix: stats
    title: Statistics
    # A foundations series for beginners, in video order: each lesson leans only on the ones before it.
    # Topics are kept when they help the next lesson, even if the MRCP rarely asks them
    # (the Part 1 blueprint gives statistics, epidemiology and EBM about 5 of 200 questions).
    topics:
      # A. Describing data
      - { slug: data-types,               title: Types of data,                        status: draft,   video: null }
      - { slug: centre-shape-spread,      title: "Centre, shape and spread",           status: draft,   video: null }
      - { slug: standard-error,           title: Standard error,                       status: draft,   video: null }
      # B. Testing ideas
      - { slug: hypothesis-testing,       title: Hypothesis testing,                   status: draft,   video: null }
      - { slug: errors-and-power,         title: Errors and power,                     status: planned, video: null }
      - { slug: choose-the-right-test,    title: Choosing the right test,              status: planned, video: null }
      - { slug: correlation-regression,   title: Correlation and regression,           status: planned, video: null }
      - { slug: survival-analysis,        title: Survival analysis,                    status: planned, video: null }
      - { slug: adjusting-for-confounders, title: Adjusting for confounders,           status: planned, video: null }
      # C. Measuring disease and effect
      - { slug: incidence-prevalence,     title: Incidence and prevalence,             status: planned, video: null }
      - { slug: risk-and-odds,            title: Risk and odds,                        status: planned, video: null }
      - { slug: nnt-nnh,                  title: NNT and NNH,                          status: planned, video: null }
      # D. Diagnostic tests and screening
      - { slug: sensitivity-specificity,  title: Sensitivity and specificity,          status: planned, video: null }
      - { slug: predictive-values,        title: Predictive values,                    status: planned, video: null }
      - { slug: likelihood-ratios,        title: Likelihood ratios,                    status: planned, video: null }
      - { slug: screening,                title: Screening,                            status: planned, video: null }
      # E. Study design and evidence
      - { slug: study-designs,            title: Study designs,                        status: planned, video: null }
      - { slug: bias-confounding,         title: Bias and confounding,                 status: planned, video: null }
      - { slug: clinical-trials,          title: Clinical trials,                      status: planned, video: null }
      - { slug: meta-analysis,            title: Systematic reviews and meta-analysis, status: planned, video: null }
      - { slug: health-economics,         title: Health economics,                     status: planned, video: null }

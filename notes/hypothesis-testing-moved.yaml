# Hypothesis testing as it stood before the split into three lessons (2026-10-02).
# These slides and items left lesson 4 (stats.hypothesis-testing) and wait for lesson 5 (stats.testing-a-difference)
# and lesson 6 (stats.ci-and-p). The case and warm-up IDs here are retired in lesson 4: give them new IDs in their new topic.
# Not built: this file is notes only.

learn:
  # The coin: 10 heads in a row from a coin said to be fair. p = 2 ÷ 1,024 ≈ 0.002 (all heads or all tails).
  - id: coin
    pattern: story
    title: Is the coin fair?
    kind: coin
    start: 1
    tosses: 10
    claim: "{h0}: the coin is fair"

  # The standard error of a difference, then the trial's 4 mmHg on the bell of gaps chance alone would give:
  # SEM 15 ÷ √200 ≈ 1.1 each; SE of the gap 15 × √(2 ÷ 200) = 1.5; 4 ÷ 1.5 = 2.7 SEs; each tail 0.4%, p ≈ 0.008.
  - id: gap
    pattern: story
    title: How big a gap can chance make?
    kind: gap
    start: 1
    sd: 15
    n: 200
    gap: 4
    unit: mmHg
    means: [140, 136]
    means_axis: Systolic BP (mmHg)
    labels: [Placebo, Drug, Gap]
    axis: Extra fall on the drug (mmHg)
    y_axis: "% of trials"

  - id: recap
    pattern: reveal-cards
    title: Three spreads
    cards:
      - { family: par, icon: spread, figure: ht-sd,  label: SD,                   answer: "People differ: 15 mmHg." }
      - { family: se,  icon: narrow, figure: ht-sem, label: SEM,                  answer: "Means differ: 15 ÷ √200 ≈ 1.1 mmHg." }
      - { family: se,  icon: narrow, figure: ht-gap, label: SE of the difference, answer: "Gaps differ: 15 × √(2 ÷ 200) ≈ 1.5 mmHg." }


  # Why size matters: the same 4 mmHg. 200 in each group: SE = 15 × √(2 ÷ 200) = 1.5, 4 ÷ 1.5 = 2.7 SEs, p ≈ 0.008.
  # 20 in each group: SE = 15 × √(2 ÷ 20) ≈ 4.7, 4 ÷ 4.7 ≈ 0.85 SEs, p ≈ 0.4.
  - id: size
    pattern: story
    title: Why does size matter?
    kind: ncompare
    sd: 15
    gap: 4
    ns: [200, 20]
    labels: [400 people, 40 people]
    axis: Extra fall on the drug (mmHg)
    y_axis: "% of trials"

  # The 0.05 line: both trials on one ruler (p from the gap story and the Not guilty story).
  # That the line is a convention (0.049 and 0.051 are almost the same evidence) is said aloud, not written.
  - id: line
    pattern: story
    title: Where is the line?
    kind: line
    # Fisher (1925) noted that p = 0.05 falls at 1.96, nearly 2, standard deviations and took it as a convenient limit
    origin: Fisher, 1925
    cut: 0.05
    trials:
      - { label: Trial of 400, p: 0.008 }
      - { label: Trial of 40,  p: 0.4 }

  # The 95% CI: our gap ± 2 SE of the difference = 4 ± 2 × 1.5 = 1 to 7 mmHg, the middle 95% of a bell round our 4;
  # then chance's bell round 0 with its own 95% (−3 to +3): 0 lies outside 1 to 7 as 4 lies outside −3 to +3.
  - id: ci
    pattern: story
    title: Where could the true effect be?
    kind: ci
    start: 1
    sd: 15
    n: 200
    gap: 4
    labels: [Our trial, No effect]
    axis: Extra fall on the drug (mmHg)
    y_axis: "% of trials"

  # The CI and p agree. The difference keeps the trial's SE (1.5): at 4 (CI 1 to 7) p = 0.008; at 3 (CI 0 to 6)
  # p = 0.05 (2 SE for 1.96); at 1.5 (CI −1.5 to 4.5) p = 0.3. The ratio is a relative risk, no effect = 1,
  # its CI 0.4 wide: 0.45 to 0.85, then 0.6 to 1.0 (touching), then 0.8 to 1.2 (across).
  - id: agree
    pattern: story
    title: The CI and p agree
    kind: slide
    panels:
      - { label: A difference, none: 0, axis: Extra fall on the drug (mmHg), range: [-2, 8], ticks: [0, 2, 4, 6, 8], se: 1.5, at: [4, 3, 1.5] }
      - { label: A ratio, none: 1, axis: Relative risk, range: [0.4, 1.6], ticks: [0.5, 1, 1.5], half: 0.2, at: [0.65, 0.8, 1.0] }

  - id: important
    pattern: reveal-cards
    title: Significant or important?
    cards:
      - { family: se,   icon: narrow, figure: ht-huge,  label: Huge trial,  answer: "10,000 people, 1 mmHg: significant, but too small to matter." }
      - { family: gray, icon: spread, figure: ht-small, label: Small trial, answer: "30 people, 10 mmHg, p = 0.2: it would matter, but it is not proven." }

  - id: hook-solved
    pattern: working
    title: Back to the trial
    scene: doctor-think
    stem: "[[200 people took a new drug and 200 a placebo]]. Systolic BP fell [[4 mmHg more on the drug (SD 15 mmHg)]]."
    lines:
      - { family: se,   text: "SE = 15 × √(2 ÷ 200) =", result: 1.5 mmHg }
      - { family: se,   text: "4 ÷ 1.5 =", result: 2.7 SEs }
      - { family: test, text: "p =", result: "0.008" }
      - { family: se,   text: "95% CI = 4 ± 2 × 1.5 =", result: 1 to 7 mmHg }
    answer: "Unlikely to be chance. Reject H₀: the drug lowers BP."

practise:
  - id: warmup
    pattern: sort
    title: Significant or not?
    buckets: [sig, ns]
    retry: "Ask: is p below 0.05, or does the CI miss no effect (0 for a difference, 1 for a ratio)?"
    done: "Below 0.05, or a CI that misses no effect, is significant. For a difference no effect is 0; for a ratio it is 1."
    items:
      - { id: w01, label: "p = 0.01",                                answer: sig, why: "Below 0.05." }
      - { id: w02, label: "p = 0.3",                                 answer: ns,  why: "Above 0.05: chance explains it easily." }
      - { id: w03, label: "Difference 5 mmHg (95% CI 2 to 8)",       answer: sig, why: "The CI misses 0, the no-effect value for a difference." }
      - { id: w04, label: "Difference 2 kg (95% CI −1 to 5)",        answer: ns,  why: "The CI crosses 0." }
      - { id: w05, label: "Relative risk 0.7 (95% CI 0.5 to 0.9)",   answer: sig, why: "The CI misses 1, the no-effect value for a ratio." }
      - { id: w06, label: "Odds ratio 1.2 (95% CI 0.8 to 1.9)",      answer: ns,  why: "The CI crosses 1." }
      - { id: w07, label: "p = 0.049",                               answer: sig, why: "Just below 0.05, though almost the same evidence as 0.051." }
      - { id: w08, label: "Relative risk 1.1 (95% CI 0.9 to 1.3)",   answer: ns,  why: "The CI crosses 1." }


  cases:
      - id: c01
        scene: case-older
        solved: true
        stem: In a trial of 400 people with high blood pressure, systolic BP fell [[4 mmHg more on a new drug than on placebo (95% CI 1 to 7 mmHg)]].
        question: Is the result statistically significant at the 5% level?
        options: ["Yes: the CI misses 0", "No: the CI does not include 1", "Not without the p-value"]
        answer: "Yes: the CI misses 0"
        hint: For a difference, no effect is 0. Does the CI include it?
        why: "The whole CI, 1 to 7 mmHg, is above 0, so p is below 0.05."
        tutor: "For a difference, no effect is 0. The 95% CI (1 to 7 mmHg) misses 0, so the result is significant at 5%: the CI and the p-value always agree. Here p = 0.008."

      - id: c04
        scene: case-people
        stem: In a trial of a weight-loss drug, patients lost [[2 kg more than on placebo (95% CI −0.5 to 4.5 kg)]].
        question: Is the difference statistically significant at the 5% level?
        options: ["No: the CI includes 0", "Yes: the CI does not include 1", "Yes: they lost 2 kg more"]
        answer: "No: the CI includes 0"
        hint: For a difference, no effect is 0.
        why: "The CI runs from −0.5 to 4.5 kg, so it includes 0: p is above 0.05."

      - id: c05
        scene: case-head
        stem: A statin trial reports a [[relative risk of stroke of 0.80 (95% CI 0.65 to 0.98)]].
        question: Is the result statistically significant at the 5% level?
        options: ["Yes: the CI misses 1", "No: the CI does not include 0", "No: the CI is too wide"]
        answer: "Yes: the CI misses 1"
        hint: For a ratio, no effect is 1.
        why: "A relative risk of 1 means the same risk in both groups. The CI, 0.65 to 0.98, stays below 1, so p is below 0.05."

      - id: c06
        scene: case-xray
        stem: A case–control study of lung cancer reports an [[odds ratio of 1.3 for exposure to a solvent at work (95% CI 0.9 to 1.8)]].
        question: Is the result statistically significant at the 5% level?
        options: ["No: the CI includes 1", "Yes: the odds ratio is above 1", "Yes: the CI misses 0"]
        answer: "No: the CI includes 1"
        hint: For a ratio, no effect is 1.
        why: "The CI, 0.9 to 1.8, includes 1 (no effect), so p is above 0.05."

      - id: c07
        scene: case-older
        stem: A trial in [[20,000 people]] finds that a new drug lowers systolic BP by [[1 mmHg more than placebo, p < 0.001]].
        question: What is the best conclusion?
        options: ["Statistically significant, but too small to matter", "Not statistically significant", "A large and important effect"]
        answer: "Statistically significant, but too small to matter"
        hint: A very large trial can detect a very small difference.
        why: "With 20,000 people even 1 mmHg is unlikely to be chance, but a fall that small makes little difference to patients."

      - id: c09
        scene: case-bloodbag
        twist: true
        stem: A trial reports that a drug raised haemoglobin by [[3 g/L more than placebo, p = 0.04]].
        question: Which 95% CI fits this result?
        options: ["0.2 to 5.8 g/L", "−0.3 to 6.3 g/L", "−3 to 9 g/L"]
        answer: "0.2 to 5.8 g/L"
        hint: p below 0.05 means the 95% CI must miss 0.
        why: "Only 0.2 to 5.8 g/L misses 0, which is what p = 0.04 requires. The others include 0, so they would give p above 0.05."
